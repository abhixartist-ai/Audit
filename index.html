<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SKU Extract Tool</title>

<style>
body{
font-family:Arial;
background:#f4f6fb;
padding:20px;
}

table{
border-collapse:collapse;
width:100%;
margin-top:20px;
background:white;
}

th,td{
border:1px solid #ccc;
padding:8px;
}

th{
background:#667eea;
color:white;
}
</style>

</head>

<body>

<h2>SKU Extract Tool</h2>

<input type="file" id="fileInput">

<table id="resultTable">

<thead>
<tr>
<th>Description</th>
<th>SKU</th>
<th>Quantity</th>
</tr>
</thead>

<tbody></tbody>

</table>

<script>

document.getElementById("fileInput").addEventListener("change",function(e){

let file = e.target.files[0];

let reader = new FileReader();

reader.onload=function(event){

let text = event.target.result;

let rows = text.split(/\r?\n/);

let tableBody = document.querySelector("#resultTable tbody");

tableBody.innerHTML="";

rows.forEach(function(row){

if(row.trim()=="") return;

let cols = row.split("\t");

let description = cols[0] || "";
let qty = cols[1] || "";

/* LAST bracket extract */

let lastOpen = description.lastIndexOf("(");
let lastClose = description.lastIndexOf(")");

let sku = "SKU Unknown";

if(lastOpen !== -1 && lastClose !== -1 && lastClose > lastOpen){
sku = description.substring(lastOpen+1,lastClose);
}

let tr=document.createElement("tr");

tr.innerHTML=`
<td>${description}</td>
<td>${sku}</td>
<td>${qty}</td>
`;

tableBody.appendChild(tr);

});

};

reader.readAsText(file);

});

</script>

</body>
</html>
