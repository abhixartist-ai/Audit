<!DOCTYPE html><html>
<head>
<meta charset="UTF-8">
<title>Amazon / Flipkart Label & SKU Tool</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><style>
body{
font-family:Arial;
background:linear-gradient(135deg,#667eea,#764ba2);
padding:30px;
}

.card{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 10px 25px rgba(0,0,0,0.15);
max-width:900px;
margin:auto;
}

button,input,select{
padding:10px;
margin:10px;
}

button{cursor:pointer}

#preview canvas{
border:1px solid #ccc;
margin:10px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th,td{
border:1px solid #ddd;
padding:8px;
}

th{background:#f5f5f5}

</style></head><body><div class="card"><h2>Amazon / Flipkart Label & SKU Tool</h2><select id="platform">
<option value="amazon">Amazon</option>
<option value="flipkart">Flipkart</option>
</select><br><input type="file" id="pdfUpload" accept="application/pdf"><br><button onclick="processPDF()">Process File</button>

<button onclick="downloadCSV()">Download SKU Summary</button>

<div id="preview"></div><h3>Order Data</h3><table id="orderTable">
<thead>
<tr>
<th>Description</th>
<th>SKU</th>
<th>Qty</th>
</tr>
</thead>
<tbody></tbody>
</table><h3>SKU Summary</h3><table id="summaryTable">
<thead>
<tr>
<th>SKU</th>
<th>Total Qty</th>
</tr>
</thead>
<tbody></tbody>
</table></div><script>

// PDF.js worker setup
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


let skuTotals={}

async function processPDF(){

const file=document.getElementById("pdfUpload").files[0]

if(!file){
alert("Please upload PDF first")
return
}

skuTotals={}

document.querySelector("#orderTable tbody").innerHTML=""
document.querySelector("#summaryTable tbody").innerHTML=""

const data=await file.arrayBuffer()

const pdf=await pdfjsLib.getDocument({data}).promise

for(let page=1;page<=pdf.numPages;page++){

const p=await pdf.getPage(page)

const textContent=await p.getTextContent()

let pageText=""

textContent.items.forEach(item=>{
pageText+=item.str+" "
})

extractOrders(pageText)

}

updateSummary()

}

function extractOrders(text){

// split by Qty words or numbers pattern

let lines=text.split(/Qty|QTY|qty/)

lines.forEach(line=>{

let qtyMatch=line.match(/(\d+)/)

if(!qtyMatch) return

let qty=parseInt(qtyMatch[1])

// find last bracket as SKU

let brackets=line.match(/([^()]*)/g)

if(!brackets) return

let sku=brackets[brackets.length-1].replace(/[()]/g,"").trim()

let description=line.trim()

addOrder(description,sku,qty)

})

}

function addOrder(description,sku,qty){

const tbody=document.querySelector("#orderTable tbody")

let tr=document.createElement("tr")

tr.innerHTML="<td>"+description+"</td><td>"+sku+"</td><td>"+qty+"</td>"

tbody.appendChild(tr)

if(!skuTotals[sku]) skuTotals[sku]=0

skuTotals[sku]+=qty

}

function updateSummary(){

const tbody=document.querySelector("#summaryTable tbody")

for(let sku in skuTotals){

let tr=document.createElement("tr")

tr.innerHTML="<td>"+sku+"</td><td>"+skuTotals[sku]+"</td>"

tbody.appendChild(tr)

}

}

function downloadCSV(){

let csv="SKU,Qty\n"

for(let sku in skuTotals){

csv+=sku+","+skuTotals[sku]+"\n"

}

const blob=new Blob([csv])

const a=document.createElement("a")

a.href=URL.createObjectURL(blob)

a.download="sku-summary.csv"

a.click()

}

</script></body>
</html>
