<!DOCTYPE html>
<html>
<head>

<title>Amazon / Flipkart Label Tool</title>
<link rel="icon" href="favicon.png">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
</script>

<script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
body{
font-family:Arial;
padding:30px;
margin:0;
min-height:100vh;
background:linear-gradient(135deg,#1e1e2f,#12121c);
background-repeat:no-repeat;
background-attachment:fixed;
color:#e4e6eb;
}

/* LOGIN */
#loginBox{
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:linear-gradient(135deg,#1e1e2f,#12121c);
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:9999;
}

#passInput{
width:300px;height:45px;
font-size:18px;
padding:8px 12px;
border-radius:10px;
border:1px solid #444;
background:#1f1f2e;
color:#fff;
}

.loginBtn{
width:200px;
}

/* UPLOAD BOX */
#dropZone{
border:2px dashed #667eea;
padding:40px;
text-align:center;
background:rgba(255,255,255,0.05);
margin-top:20px;
transition:0.3s;
border-radius:12px;
cursor:pointer;
}

#dropZone:hover{
background:rgba(102,126,234,0.15);
}

#dropZone.active{
background:rgba(0,255,150,0.15);
border-color:#00ff99;
}

/* BUTTON */
button{
padding:12px 22px;
background:linear-gradient(135deg,#667eea,#764ba2);
color:white;
border:none;
cursor:pointer;
margin-top:12px;
border-radius:10px;
font-weight:bold;
}

button:hover{
box-shadow:0 10px 25px rgba(102,126,234,0.4);
}

/* LOADER */
#loader{
display:none;
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,0.6);
justify-content:center;
align-items:center;
z-index:9999;
}

#loader div{
border:6px solid #333;
border-top:6px solid #667eea;
border-radius:50%;
width:60px;height:60px;
animation:spin 1s linear infinite;
}

@keyframes spin{
0%{transform:rotate(0)}
100%{transform:rotate(360deg)}
}

@media(max-width:600px){
body{padding:15px;}
#dropZone{padding:25px;}
button{width:100%;}
}
</style>

</head>

<body>

<!-- LOGIN -->
<div id="loginBox">
<h2>Enter Password</h2>
<input type="password" id="passInput">
<button class="loginBtn" onclick="checkPassword()">Enter</button>
<p id="errorMsg" style="color:red;"></p>
</div>

<h2>Amazon / Flipkart Label Tool</h2>

<!-- UPLOAD -->
<div id="dropZone">
<input type="file" id="pdfUpload" accept="application/pdf" hidden>
<span id="dropText">Click or Drag & Drop PDF</span>
</div>

<br>

<button onclick="processPDF()">Print Amazon Labels</button>
<button onclick="processFlipkart()">Print Flipkart Labels</button>
<button onclick="downloadSummary()">Download Summary</button>

<p id="status"></p>

<div id="loader"><div></div></div>

<script>

let pdfBuffer,skuMap={},summary=[],serial=1,orderNumber=1

/* PASSWORD */
function checkPassword(){
if(document.getElementById("passInput").value==="1234"){
document.getElementById("loginBox").style.display="none"
}else{
document.getElementById("errorMsg").innerText="Wrong Password"
}
}

/* ENTER KEY */
document.getElementById("passInput").addEventListener("keydown",e=>{
if(e.key==="Enter")checkPassword()
})

/* LOADER */
function showLoader(){loader.style.display="flex"}
function hideLoader(){loader.style.display="none"}

/* UPLOAD */
dropZone.onclick=()=>pdfUpload.click()

pdfUpload.onchange=handleFile

dropZone.ondragover=e=>{
e.preventDefault()
dropZone.style.background="rgba(102,126,234,0.15)"
}

dropZone.ondrop=e=>{
e.preventDefault()
handleFile({target:{files:[e.dataTransfer.files[0]]}})
}

function handleFile(e){
let file=e.target.files[0]
if(!file)return

showLoader()

let reader=new FileReader()
reader.onload=function(){
pdfBuffer=this.result
status.innerText="PDF Loaded"
dropText.innerText="✔ "+file.name
dropZone.classList.add("active")
hideLoader()
}
reader.readAsArrayBuffer(file)
}

/* CSV */
fetch("sku_map.csv")
.then(r=>r.text())
.then(t=>{
t.split("\n").slice(1).forEach(r=>{
let c=r.split(",")
if(c.length>=2){
if(!skuMap[c[0]])skuMap[c[0]]=[]
skuMap[c[0]].push(c[1])
}
})
})

/* AMAZON */
async function processPDF(){
if(!pdfBuffer){alert("Upload PDF");return}

showLoader()

const pdf=await pdfjsLib.getDocument({data:pdfBuffer}).promise
const newPdf=await PDFLib.PDFDocument.create()
const original=await PDFLib.PDFDocument.load(pdfBuffer)

for(let i=1;i<=pdf.numPages;i++){
const p=await pdf.getPage(i)
const text=(await p.getTextContent()).items.map(x=>x.str).join(" ")

if(!text.includes("Tax Invoice")){

const inv=await pdf.getPage(i+1)
const invText=(await inv.getTextContent()).items.map(x=>x.str).join(" ")

/* ✅ FIXED SKU LOGIC */
let skuMatches=[...invText.matchAll(/\(\s*([A-Z0-9]+(?:-[A-Z0-9]+)+)\s*\)/g)]

let qtyMatches=[...invText.matchAll(/₹[\d\.]+\s+(\d+)\s+₹/g)]

const [copy]=await newPdf.copyPages(original,[i-1])
newPdf.addPage(copy)

let page=newPdf.getPages().pop()

for(let k=0;k<skuMatches.length;k++){
let sku=skuMatches[k][1]
let qty=qtyMatches[k]?parseInt(qtyMatches[k][1]):1

let rep=skuMap[sku]||[sku]

let pcs=qty

let y=180-(k*14)

page.drawText(rep.join(", ")+" x"+qty+" ("+pcs+")",{x:50,y:y,size:12})
}
}
}

let win=window.open(URL.createObjectURL(new Blob([await newPdf.save()],{type:"application/pdf"})))
setTimeout(()=>win.print(),500)

window.onfocus=()=>{hideLoader()}
}

/* FLIPKART */
async function processFlipkart(){
if(!pdfBuffer){alert("Upload PDF");return}
showLoader()

const pdf=await pdfjsLib.getDocument({data:pdfBuffer}).promise
const newPdf=await PDFLib.PDFDocument.create()
const original=await PDFLib.PDFDocument.load(pdfBuffer)

for(let i=0;i<pdf.numPages;i++){
const [p]=await newPdf.copyPages(original,[i])
newPdf.addPage(p)
}

let win=window.open(URL.createObjectURL(new Blob([await newPdf.save()],{type:"application/pdf"})))
setTimeout(()=>win.print(),500)

window.onfocus=()=>{hideLoader()}
}

/* EXCEL */
function downloadSummary(){
let ws=XLSX.utils.json_to_sheet(summary)
let wb=XLSX.utils.book_new()
XLSX.utils.book_append_sheet(wb,ws,"Summary")
XLSX.writeFile(wb,"summary.xlsx")
}

/* SHORTCUT */
document.addEventListener("keydown",e=>{
if(e.ctrlKey&&e.shiftKey&&e.key==="A"){processPDF()}
if(e.ctrlKey&&e.shiftKey&&e.key==="F"){processFlipkart()}
})

</script>

</body>
</html>
