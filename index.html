<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Labour Payroll Manager</title>

<style>

body{
font-family:Arial;
background:linear-gradient(135deg,#667eea,#764ba2);
padding:20px;
}

.card{
background:white;
padding:20px;
border-radius:12px;
margin-bottom:20px;
box-shadow:0 6px 15px rgba(0,0,0,0.2);
}

button{
padding:7px 12px;
background:#667eea;
border:none;
color:white;
border-radius:6px;
cursor:pointer;
margin:2px;
}

input,select{
padding:6px;
margin:3px;
}

table{
width:100%;
border-collapse:collapse;
}

td,th{
padding:8px;
border-bottom:1px solid #ddd;
}

.nav button{
margin-right:10px;
}

</style>
</head>

<body>

<div class="nav">
<button onclick="showPage('labour')">Labour</button>
<button onclick="showPage('attendance')">Attendance</button>
<button onclick="showPage('report')">Report</button>
</div>

<!-- LABOUR MANAGEMENT -->

<div id="labour" class="card">

<h3>Labour Management</h3>

<input id="name" placeholder="Name">
<input id="rate" type="number" placeholder="Hourly Salary">
<input id="phone" placeholder="Phone">

<select id="type">
<option value="hourly">Hourly</option>
<option value="fixed">Fixed Salary</option>
</select>

<input id="fixedSalary" placeholder="Monthly Salary">

<button onclick="addLabour()">Add</button>

<table id="labourTable"></table>

</div>


<!-- ATTENDANCE -->

<div id="attendance" class="card" style="display:none">

<h3>Attendance</h3>

<input type="date" id="attDate">

<table id="attendanceTable"></table>

</div>


<!-- REPORT -->

<div id="report" class="card" style="display:none">

<h3>Salary Report</h3>

From
<input type="date" id="fromDate">

To
<input type="date" id="toDate">

<button onclick="generateReport()">Generate</button>

<div id="reportList"></div>

</div>


<script>

let labour=JSON.parse(localStorage.getItem("labour")||"[]")
let attendance=JSON.parse(localStorage.getItem("attendance")||"[]")
let advance=JSON.parse(localStorage.getItem("advance")||"[]")
let payments=JSON.parse(localStorage.getItem("payments")||"[]")

function save(){
localStorage.setItem("labour",JSON.stringify(labour))
localStorage.setItem("attendance",JSON.stringify(attendance))
localStorage.setItem("advance",JSON.stringify(advance))
localStorage.setItem("payments",JSON.stringify(payments))
}

function showPage(p){

document.getElementById("labour").style.display="none"
document.getElementById("attendance").style.display="none"
document.getElementById("report").style.display="none"

document.getElementById(p).style.display="block"

if(p=="attendance") loadAttendance()
if(p=="labour") loadLabour()

}

function addLabour(){

let n=name.value

if(n==""){
alert("Enter name")
return
}

labour.push({
name:n,
rate:parseFloat(rate.value||0),
phone:phone.value,
type:type.value,
fixedSalary:parseFloat(fixedSalary.value||0)
})

save()

name.value=""
rate.value=""
phone.value=""
fixedSalary.value=""

loadLabour()

}

function loadLabour(){

let t="<tr><th>Name</th><th>Salary</th><th>Phone</th><th>Action</th></tr>"

labour.forEach((l,i)=>{

t+=`

<tr>

<td>${l.name}</td>
<td>${l.type=="hourly"?l.rate+"/hr":l.fixedSalary}</td>
<td>${l.phone}</td>

<td>
<button onclick="editLabour(${i})">Edit</button>
<button onclick="deleteLabour(${i})">Delete</button>
</td>

</tr>

`

})

labourTable.innerHTML=t

}

function editLabour(i){

let l=labour[i]

name.value=l.name
rate.value=l.rate
phone.value=l.phone
type.value=l.type
fixedSalary.value=l.fixedSalary

labour.splice(i,1)

save()

loadLabour()

}

function deleteLabour(i){

if(confirm("Delete labour?")){

labour.splice(i,1)

save()

loadLabour()

}

}

function loadAttendance(){

let today=new Date().toISOString().slice(0,10)

attDate.value=today

let t="<tr><th>Name</th><th>Status</th><th>Hour</th><th>Min</th><th>Advance</th></tr>"

labour.forEach((l,i)=>{

t+=`

<tr>

<td>${l.name}</td>

<td>

<select id="s${i}">
<option value="P">Present</option>
<option value="A">Absent</option>
</select>

</td>

<td><input id="h${i}" type="number" value="10" style="width:60px"></td>

<td><input id="m${i}" type="number" value="0" style="width:60px"></td>

<td><input id="adv${i}" type="number" style="width:70px"></td>

</tr>

`

})

t+=`</table><button onclick="saveAttendance()">Save</button>`

attendanceTable.innerHTML=t

}

function saveAttendance(){

let d=attDate.value

labour.forEach((l,i)=>{

attendance.push({

name:l.name,
date:d,
status:document.getElementById("s"+i).value,
hours:parseFloat(document.getElementById("h"+i).value||0),
min:parseFloat(document.getElementById("m"+i).value||0)

})

let adv=document.getElementById("adv"+i).value

if(adv>0){

advance.push({
name:l.name,
amount:parseFloat(adv),
date:d
})

}

})

save()

alert("Saved")

}

function generateReport(){

let from=fromDate.value
let to=toDate.value

let html=""

labour.forEach(l=>{

let total=0

attendance.forEach(a=>{

if(a.name==l.name && a.date>=from && a.date<=to && a.status=="P"){

let hrs=a.hours+(a.min/60)

if(l.type=="hourly"){
total+=hrs*l.rate
}

}

})

if(l.type=="fixed"){
total=l.fixedSalary
}

let adv=0

advance.forEach(v=>{
if(v.name==l.name && v.date<=to){
adv+=v.amount
}
})

let final=total-adv

let paid=payments.find(p=>p.name==l.name && p.from==from && p.to==to)

let status=paid?"PAID":"UNPAID"

let msg=`Salary ${l.name}
From ${from} To ${to}
Total ₹${total}
Advance ₹${adv}
Pay ₹${final}`

let wa=`https://wa.me/${l.phone}?text=${encodeURIComponent(msg)}`

html+=`

<div class="card">

<b>${l.name}</b><br>

Total ₹${total}<br>
Advance ₹${adv}<br>
Final ₹${final}<br>

Status: ${status}

<br><br>

<button onclick="markPaid('${l.name}','${from}','${to}')">Mark Paid</button>

<a href="${wa}" target="_blank">WhatsApp</a>

</div>

`

})

reportList.innerHTML=html

}

function markPaid(name,from,to){

payments.push({
name:name,
from:from,
to:to
})

save()

alert("Marked Paid")

}

loadLabour()

</script>

</body>
</html>
