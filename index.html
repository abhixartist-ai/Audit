<!DOCTYPE html>
<html>
<head>

<title>Amazon Label Tool PRO (OCR Enabled)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
</script>

<script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@2/dist/tesseract.min.js"></script>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(135deg,#667eea,#764ba2);
color:#fff;
text-align:center;
padding:20px;
}

#dropZone{
border:2px dashed #fff;
padding:40px;
border-radius:12px;
cursor:pointer;
}

button{
width:100%;
margin-top:10px;
padding:12px;
border:none;
border-radius:10px;
background:#000;
color:#fff;
cursor:pointer;
}

#loader{
display:none;
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,0.7);
justify-content:center;
align-items:center;
z-index:999;
}

#loader div{
width:60px;height:60px;
border:6px solid #333;
border-top:6px solid #fff;
border-radius:50%;
animation:spin 1s linear infinite;
}

@keyframes spin{
100%{transform:rotate(360deg)}
}
</style>

</head>

<body>

<h2>Amazon Label Tool PRO (OCR)</h2>

<div id="dropZone" onclick="fileInput.click()">
<input type="file" id="fileInput" hidden>
Click or Drag PDF
</div>

<button onclick="processPDF()">Print Label PDF</button>
<button onclick="downloadExcel()">Download Excel</button>

<div id="loader"><div></div></div>

<script>

let pdfBuffer=null
let summary=[]
let skuMap={}
let serial=1, orderNo=1

fileInput.onchange=e=>{
let file=e.target.files[0]
let r=new FileReader()
r.onload=()=>pdfBuffer=r.result
r.readAsArrayBuffer(file)
}

dropZone.ondragover=e=>e.preventDefault()
dropZone.ondrop=e=>{
e.preventDefault()
let file=e.dataTransfer.files[0]
let r=new FileReader()
r.onload=()=>pdfBuffer=r.result
r.readAsArrayBuffer(file)
}

function show(){loader.style.display="flex"}
function hide(){loader.style.display="none"}

/* SKU MAP */
fetch("sku_map.csv").then(r=>r.text()).then(t=>{
t.split("\n").slice(1).forEach(r=>{
let c=r.split(",")
if(c.length>=2){
if(!skuMap[c[0]])skuMap[c[0]]=[]
skuMap[c[0]].push(c[1])
}
})
})

/* OCR FUNCTION */
async function getShipDateFromLabel(page){

const viewport = page.getViewport({scale:2})
const canvas = document.createElement("canvas")
const ctx = canvas.getContext("2d")

canvas.width = viewport.width
canvas.height = viewport.height

await page.render({canvasContext:ctx, viewport}).promise

const { data:{ text } } = await Tesseract.recognize(canvas,"eng")

let match = text.match(/\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4}/)

return match ? match[0] : "Not found"
}

async function processPDF(){

if(!pdfBuffer){alert("Upload PDF");return}

show()

summary=[];serial=1;orderNo=1

const pdf=await pdfjsLib.getDocument({data:pdfBuffer}).promise
const newPdf=await PDFLib.PDFDocument.create()
const original=await PDFLib.PDFDocument.load(pdfBuffer)

for(let i=1;i<=pdf.numPages;i+=2){

/* ===== LABEL PAGE (OCR) ===== */
const labelPage=await pdf.getPage(i)
let shipDate=await getShipDateFromLabel(labelPage)

/* ===== INVOICE PAGE ===== */
const invPage=await pdf.getPage(i+1)
const invItems=(await invPage.getTextContent()).items
const invText=invItems.map(x=>x.str).join(" ")

/* ORDER ID */
let orderMatch=invText.match(/Order\s*(ID|Number)[^\d]*([0-9-]{10,})/i)
let orderId=orderMatch?orderMatch[2]:"NA"

/* ORDER DATE */
let orderDate="Not found"
let m=invText.match(/\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4}/)
if(m) orderDate=m[0]

/* SKU */
let skuMatches=[...invText.matchAll(/\(\s*([A-Z0-9-]+)\s*\)/g)]
let qtyMatches=[...invText.matchAll(/₹[\d\.]+\s+(\d+)\s+₹/g)]

/* ADD LABEL PAGE */
const [copied]=await newPdf.copyPages(original,[i-1])
newPdf.addPage(copied)

let drawPage=newPdf.getPages().pop()

for(let k=0;k<skuMatches.length;k++){

let sku=skuMatches[k][1]
let qty=qtyMatches[k]?parseInt(qtyMatches[k][1]):1
let rep=skuMap[sku]||[sku]

let pack=0
rep.forEach(r=>{
let mm=r.match(/(\d+)$/)
pack+=mm?parseInt(mm[1]):1
})

let pcs=pack*qty

summary.push({
order:orderNo,
orderId,
orderDate,
shipDate,
sno:serial++,
sku,
replacement:rep.join(", "),
qty,
pcs
})

drawPage.drawText(rep.join(", ")+" x"+qty+" ("+pcs+")",
{x:50,y:180-(k*14),size:12})
}

orderNo++
}

/* PRINT */
let blob=new Blob([await newPdf.save()],{type:"application/pdf"})
let url=URL.createObjectURL(blob)
let win=window.open(url)
setTimeout(()=>win.print(),500)

window.onfocus=hide
}

/* EXCEL */
function downloadExcel(){

let data=[["Order","Order ID","Order Date","Ship Date","S.No","SKU","Replacement","Qty","PCS"]]

summary.forEach(r=>{
data.push([
r.order,
r.orderId,
r.orderDate,
r.shipDate,
r.sno,
r.sku,
r.replacement,
r.qty,
r.pcs
])
})

let ws=XLSX.utils.aoa_to_sheet(data)
let wb=XLSX.utils.book_new()
XLSX.utils.book_append_sheet(wb,ws,"Summary")

let d=new Date()
let name=`Amazon_summary_${d.getDate()}-${d.getMonth()+1}-${d.getFullYear()}.xlsx`

XLSX.writeFile(wb,name)
}

</script>

</body>
</html>
