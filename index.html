<!DOCTYPE html>
<html>
<head>
<title>Order PDF Summary</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

<style>
body{
font-family: Arial;
background:#f4f6ff;
padding:20px;
}

h2{
color:#333;
}

table{
width:100%;
border-collapse:collapse;
background:white;
margin-top:20px;
}

th,td{
border:1px solid #ccc;
padding:10px;
text-align:center;
}

th{
background:#667eea;
color:white;
}

input[type=file]{
padding:10px;
background:white;
border:1px solid #ccc;
}

</style>
</head>

<body>

<h2>Upload Order PDF</h2>

<input type="file" id="uploadPDF">

<table id="orderTable">
<tr>
<th>S.No</th>
<th>SKU</th>
<th>Pack</th>
<th>Qty</th>
</tr>
</table>

<script>

let table = document.getElementById("orderTable")

document.getElementById("uploadPDF").addEventListener("change",function(e){

let file = e.target.files[0]
let reader = new FileReader()

reader.onload = function(){

let typedarray = new Uint8Array(this.result)

pdfjsLib.getDocument(typedarray).promise.then(function(pdf){

for(let i=1;i<=pdf.numPages;i++){

pdf.getPage(i).then(function(page){

page.getTextContent().then(function(text){

let content = text.items.map(item=>item.str).join(" ")

processText(content)

})

})

}

})

}

reader.readAsArrayBuffer(file)

})

function processText(text){

let words = text.split(" ")

let sku = ""
let pack = "1"
let qty = "1"

words.forEach(word=>{

if(word.includes("SKU")){
sku = word
}

if(word.includes("Pack")){
pack = word
}

})

let row = table.insertRow()

row.insertCell(0).innerHTML = table.rows.length-1
row.insertCell(1).innerHTML = sku
row.insertCell(2).innerHTML = pack
row.insertCell(3).innerHTML = qty

}

</script>

</body>
</html>
