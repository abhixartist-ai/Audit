<!DOCTYPE html>
<html>
<head>
<title>Label & SKU Tool</title>

<style>

body{
font-family:Arial;
background:#667eea;
background:linear-gradient(135deg,#667eea,#764ba2);
padding:30px;
}

.card{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 10px 20px rgba(0,0,0,0.15);
max-width:900px;
margin:auto;
}

textarea{
width:100%;
height:200px;
margin-top:10px;
}

button{
padding:10px 20px;
margin-top:10px;
cursor:pointer;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th,td{
border:1px solid #ddd;
padding:8px;
text-align:left;
}

th{
background:#f5f5f5;
}

</style>
</head>

<body>

<div class="card">

<h2>Amazon / Flipkart SKU Tool</h2>

<select id="platform">
<option>Amazon</option>
<option>Flipkart</option>
</select>

<p>Paste Invoice Table (Description + Qty)</p>

<textarea id="inputData"></textarea>

<br>

<button onclick="processData()">Generate SKU Summary</button>

<button onclick="window.print()">Print</button>

<h3>Order Data</h3>

<table id="orderTable">
<thead>
<tr>
<th>Description</th>
<th>SKU</th>
<th>Qty</th>
</tr>
</thead>
<tbody></tbody>
</table>

<h3>SKU Summary</h3>

<table id="summaryTable">
<thead>
<tr>
<th>SKU</th>
<th>Total Qty</th>
</tr>
</thead>
<tbody></tbody>
</table>

</div>

<script>

function processData(){

let text=document.getElementById("inputData").value.trim()

let rows=text.split("\n")

let tableBody=document.querySelector("#orderTable tbody")

let summaryBody=document.querySelector("#summaryTable tbody")

tableBody.innerHTML=""
summaryBody.innerHTML=""

let skuTotals={}

rows.forEach(function(row){

if(row.trim()=="") return

let cols=row.split("\t")

let description=cols[0]||""

let qty=parseInt(cols[1])||1


// find last bracket SKU

let matches=description.match(/\(([^()]*)\)/g)

let sku="SKU Unknown"

if(matches){

sku=matches[matches.length-1].replace(/[()]/g,"")

}


// order table row

let tr=document.createElement("tr")

tr.innerHTML=
"<td>"+description+"</td>"+
"<td>"+sku+"</td>"+
"<td>"+qty+"</td>"

tableBody.appendChild(tr)


// summary

if(!skuTotals[sku]){

skuTotals[sku]=0

}

skuTotals[sku]+=qty

})


// summary table

for(let sku in skuTotals){

let tr=document.createElement("tr")

tr.innerHTML=
"<td>"+sku+"</td>"+
"<td>"+skuTotals[sku]+"</td>"

summaryBody.appendChild(tr)

}

}

</script>

</body>
</html>
