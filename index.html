<!DOCTYPE html>
<html>
<head>
    <title>Amazon PDF Tool</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        body { font-family: Arial; padding:20px; }
        button { padding:10px 20px; font-size:16px; }
        #loader { display:none; font-weight:bold; color:blue; }
    </style>
</head>

<body>

<h2>Upload Amazon PDF</h2>

<input type="file" id="pdfFile">
<br><br>

<button onclick="processPDF()">Download Excel</button>

<p id="loader">Processing PDF... Please wait ⏳</p>

<script>

let skuMap = {};

// ✅ Load CSV from SAME folder
async function loadSKUMap() {
    let res = await fetch("sku_map.csv");
    let text = await res.text();

    let lines = text.split("\n");

    lines.forEach(line => {
        let parts = line.split(",");
        if(parts.length >= 2){
            let sku = parts[0].trim();
            let replacement = parts.slice(1).join(",").trim();
            skuMap[sku] = replacement;
        }
    });
}

// ✅ Clean number
function cleanAmount(val){
    return parseFloat(val.replace(/[^0-9.]/g,"")) || 0;
}

// ✅ Main Function
async function processPDF() {

    document.getElementById("loader").style.display = "block";

    await loadSKUMap();

    let file = document.getElementById("pdfFile").files[0];
    if(!file){
        alert("Upload PDF first");
        return;
    }

    let reader = new FileReader();

    reader.onload = async function() {

        let typedarray = new Uint8Array(this.result);
        let pdf = await pdfjsLib.getDocument(typedarray).promise;

        let data = [];
        let serial = 1;

        for (let i = 1; i <= pdf.numPages; i++) {

            let page = await pdf.getPage(i);
            let content = await page.getTextContent();

            let text = content.items.map(i => i.str).join(" ");

            // ❌ Skip label page
            if (!text.toLowerCase().includes("tax invoice")) continue;

            // ✅ Order No
            let orderNo = (text.match(/Order Number[:\s]*([\d-]+)/i) || [])[1] || "";

            // ✅ Order Date
            let orderDate = (text.match(/Order Date[:\s]*([\d.]+)/i) || [])[1] || "";

            // ✅ Extract rows by splitting using HSN (Amazon pattern)
            let parts = text.split("HSN:");

            parts.forEach(p => {

                // SKU detect (bracket + dash)
                let skuMatch = p.match(/\(([A-Z0-9\-]+)\)/);

                if(!skuMatch) return;

                let sku = skuMatch[1];

                // Qty detect
                let qtyMatch = p.match(/\s(\d+)\s/);
                let qty = qtyMatch ? parseInt(qtyMatch[1]) : 1;

                // Amount detect
                let amountMatch = p.match(/₹\s?([\d,]+\.\d+)/g);
                if(!amountMatch) return;

                let totalAmount = amountMatch[amountMatch.length - 1];

                let replacement = skuMap[sku] || "";

                // ✅ PCS calculation
                let pcs = 0;
                if(replacement){
                    let nums = replacement.match(/\d+/g);
                    if(nums){
                        pcs = nums.reduce((a,b)=>a+parseInt(b),0) * qty;
                    }
                }

                data.push([
                    serial++,
                    orderDate,
                    orderNo,
                    sku,
                    replacement,
                    qty,
                    pcs,
                    totalAmount,
                    "" // gross
                ]);

            });

        }

        // ✅ Gross Total
        let orderMap = {};

        data.forEach(r => {
            let amt = cleanAmount(r[7]);
            orderMap[r[2]] = (orderMap[r[2]] || 0) + amt;
        });

        data.forEach(r => {
            r[8] = orderMap[r[2]];
        });

        // ❌ If still blank
        if(data.length === 0){
            alert("No data found! PDF may be scanned or format different.");
            document.getElementById("loader").style.display = "none";
            return;
        }

        // ✅ Excel create
        let ws = XLSX.utils.aoa_to_sheet([
            ["S.No","Order Date","Order No","SKU","Replacement","Qty","Total PCS","Amount","Gross Total"],
            ...data
        ]);

        let wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Data");

        XLSX.writeFile(wb, "Amazon_Data.xlsx");

        document.getElementById("loader").style.display = "none";

    };

    reader.readAsArrayBuffer(file);
}

</script>

</body>
</html>
