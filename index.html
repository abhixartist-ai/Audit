<!DOCTYPE html>
<html>
<head>

<title>Label Tool Pro</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
</script>

<script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
body{
font-family:Poppins;
background:linear-gradient(135deg,#0f172a,#2f0130);
color:white;padding:20px;
}
.container{max-width:700px;margin:auto}
.card{background:#1e2633;padding:20px;border-radius:15px;margin-top:20px}
.btn{
width:100%;padding:12px;margin-top:10px;
border:none;border-radius:10px;
background:linear-gradient(90deg,#6a8cff,#721978);
color:white;font-weight:bold;cursor:pointer;
}
#dropZone{
height:90px;border:2px dashed #6a8cff;
display:flex;align-items:center;justify-content:center;
border-radius:12px;margin-top:15px;cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

<div class="card">
<h2>📄 Upload PDF</h2>

<div id="dropZone">
<input type="file" id="pdfUpload" hidden accept="application/pdf">
<span id="dropText">Click to Upload PDF</span>
</div>

<p id="status"></p>

<button class="btn" onclick="processPDF()">🖨 Print Amazon Labels</button>
<button class="btn" onclick="downloadSummary()">📊 Download Excel</button>

</div>

</div>

<script>

let pdfBuffer,skuMap={},summary=[],serial=1,orderIndex=1

// FILE UPLOAD
document.getElementById("dropZone").onclick=()=>pdfUpload.click()

pdfUpload.onchange=e=>{
let file=e.target.files[0]
let reader=new FileReader()
reader.onload=()=>{
pdfBuffer=reader.result
document.getElementById("status").innerText="✅ PDF Loaded"
}
reader.readAsArrayBuffer(file)
}

// LOAD CSV
async function loadCSV(){
let res=await fetch("sku_map.csv")
let text=await res.text()
text.split("\n").slice(1).forEach(r=>{
let c=r.split(",")
if(c.length>=2){
if(!skuMap[c[0]]) skuMap[c[0]]=[]
skuMap[c[0]].push(c[1])
}
})
}
loadCSV()

// 🔥 DATA EXTRACTION
async function extractData(){

if(!pdfBuffer){alert("Upload PDF first");return false}

summary=[]; serial=1; orderIndex=1

const pdf=await pdfjsLib.getDocument({data:pdfBuffer}).promise

for(let i=1;i<=pdf.numPages;i++){

const page=await pdf.getPage(i)
const text=(await page.getTextContent()).items.map(i=>i.str).join(" ")

if(!text.includes("Tax Invoice")){

if(i>=pdf.numPages) continue

const invoice=await pdf.getPage(i+1)
const invText=(await invoice.getTextContent()).items.map(i=>i.str).join(" ")

// ORDER NO
let orderNo=(invText.match(/Order\s*Number[:\s]*([0-9\-]+)/i)||[])[1]||""

// DATE
let orderDate=(invText.match(/Order\s*Date[:\s]*([\d\/\-]+)/i)||[])[1]||""

// SKU / QTY / AMOUNT
let sku=[...invText.matchAll(/\(\s*([A-Z0-9\-]+)\s*\)/g)]
let qty=[...invText.matchAll(/₹[\d\.]+\s+(\d+)\s+₹/g)]
let amt=[...invText.matchAll(/₹\s?([\d,]+\.\d{2})/g)]

for(let k=0;k<sku.length;k++){

let s=sku[k][1]
let q=qty[k]?parseInt(qty[k][1]):1
let amount=amt[k*2+1]?parseFloat(amt[k*2+1][1].replace(/,/g,'')):0

let rep=skuMap[s]||[s]

let pack=0
rep.forEach(r=>{
let m=r.match(/(\d+)$/)
pack+=m?parseInt(m[1]):1
})

let pcs=pack*q

summary.push({
order: k===0 ? orderIndex : "",
orderNo,
orderDate,
sno: serial++,
sku: s,
replacement: rep.join(", "),
qty: q,
pcs: pcs,
amount: amount
})

}

orderIndex++
}

}

return true
}

// PRINT (same as before - simplified)
async function processPDF(){
let ok=await extractData()
if(!ok)return
alert("✅ Labels ready (your original print logic can be reused)")
}

// EXCEL
async function downloadSummary(){

let ok=await extractData()
if(!ok)return

// ORDER TOTAL
let orderTotals={}
summary.forEach(r=>{
if(!orderTotals[r.orderNo])orderTotals[r.orderNo]=0
orderTotals[r.orderNo]+=r.amount
})

// CATEGORY
const categories=["SQ","BALL","CR","RH","HEART","4COM","3COM","MAT","GLOVES"]

let categoryCount={SQ:0,BALL:0,CR:0,RH:0,HEART:0,"4COM":0,"3COM":0,MAT:0,GLOVES:0}

summary.forEach(r=>{
if(!r.replacement) return

let reps=r.replacement.toUpperCase().split(",")

reps.forEach(rep=>{
rep=rep.trim()

let match=rep.match(/-(\d+)$/)
let pcs=match?parseInt(match[1]):1

categories.forEach(cat=>{
if(rep.includes(cat)){
categoryCount[cat]+=pcs*r.qty
}
})
})
})

// DATA
let data=[[
"Order Index",
"Order No",
"Order Date",
"S.No",
"SKU",
"Replacement",
"Qty",
"Total PCS",
"Item Amount",
"Order Total",
"Category",
"Total"
]]

summary.forEach(r=>{
data.push([
r.order,
r.orderNo,
r.orderDate,
r.sno,
r.sku,
r.replacement,
r.qty,
r.pcs,
r.amount,
orderTotals[r.orderNo]||0
])
})

// CATEGORY OUTPUT
categories.forEach((cat,i)=>{
if(!data[i+1]) data[i+1]=[]
data[i+1][10]=cat
data[i+1][11]=categoryCount[cat]
})

// EXPORT
let ws=XLSX.utils.aoa_to_sheet(data)
let wb=XLSX.utils.book_new()
XLSX.utils.book_append_sheet(wb,ws,"Summary")

XLSX.writeFile(wb,"Final_Report.xlsx")
}

</script>

</body>
</html>
