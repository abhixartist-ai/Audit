<!DOCTYPE html>
<html>
<head>

<title>Amazon / Flipkart Label Tool</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
</script>

<script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
body{
font-family:Arial;
margin:0;
padding:30px;
background:linear-gradient(135deg,#1e1e2f,#12121c);
background-attachment:fixed;
color:#fff;
}

#dropZone{
border:2px dashed #667eea;
padding:40px;
text-align:center;
border-radius:10px;
cursor:pointer;
background:rgba(255,255,255,0.05);
}

button{
padding:12px 20px;
margin-top:10px;
border:none;
border-radius:10px;
background:linear-gradient(135deg,#667eea,#764ba2);
color:#fff;
cursor:pointer;
}

@media(max-width:600px){
button{width:100%;}
}
</style>

</head>

<body>

<h2>Amazon Label Tool</h2>

<div id="dropZone">
<input type="file" id="pdfUpload" hidden>
Click or Drag PDF
</div>

<button onclick="processPDF()">Print Labels</button>
<button onclick="downloadSummary()">Download Excel</button>

<script>

let pdfBuffer,summary=[],serial=1,orderNumber=1

dropZone.onclick=()=>pdfUpload.click()
pdfUpload.onchange=e=>{
let r=new FileReader()
r.onload=()=>pdfBuffer=r.result
r.readAsArrayBuffer(e.target.files[0])
}

/* MAIN */
async function processPDF(){

const pdf=await pdfjsLib.getDocument({data:pdfBuffer}).promise
const newPdf=await PDFLib.PDFDocument.create()
const original=await PDFLib.PDFDocument.load(pdfBuffer)

summary=[];serial=1;orderNumber=1

for(let i=1;i<=pdf.numPages;i++){

const p=await pdf.getPage(i)
const content=await p.getTextContent()
const items=content.items

/* 🔥 SHIP DATE (POSITION BASED) */
let shipDate="NA"

for(let a=0;a<items.length;a++){

let str=items[a].str.toLowerCase()

if(str.includes("ship") || str.includes("date")){

for(let b=a;b<a+10 && b<items.length;b++){

let val=items[b].str

if(/[0-9]{1,2}\/[0-9]{1,2}\/[0-9]{2,4}/.test(val)){
shipDate=val
break
}

}

}

if(shipDate!="NA") break
}

/* LABEL PAGE */
let text=items.map(x=>x.str).join(" ")

if(!text.includes("Tax Invoice")){

/* INVOICE PAGE */
const inv=await pdf.getPage(i+1)
const invItems=(await inv.getTextContent()).items
let invText=invItems.map(x=>x.str).join(" ")

/* ORDER ID */
let orderMatch=invText.match(/Order\s*(ID|Number)[^\d]*([0-9-]+)/i)
let orderId=orderMatch?orderMatch[2]:"NA"

/* SKU */
let skuMatches=[...invText.matchAll(/\(\s*([A-Z0-9\-]+)\s*\)/g)]

const [copy]=await newPdf.copyPages(original,[i-1])
newPdf.addPage(copy)

for(let k=0;k<skuMatches.length;k++){

summary.push({
order:orderNumber,
orderId:orderId,
shipDate:shipDate,
sno:serial++,
sku:skuMatches[k][1]
})

}

orderNumber++
}

}

/* PRINT */
let blob=await newPdf.save()
let win=window.open(URL.createObjectURL(new Blob([blob])))
setTimeout(()=>win.print(),500)
}

/* EXCEL */
function downloadSummary(){

let data=[["Order","Order ID","Ship Date","S.No","SKU"]]

summary.forEach(r=>{
data.push([r.order,r.orderId,r.shipDate,r.sno,r.sku])
})

let ws=XLSX.utils.aoa_to_sheet(data)
let wb=XLSX.utils.book_new()
XLSX.utils.book_append_sheet(wb,ws,"Summary")
XLSX.writeFile(wb,"summary.xlsx")

}

</script>

</body>
</html>
