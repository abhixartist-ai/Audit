<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Labour Attendance Manager</title>

<style>
body{
font-family:Arial;
background:#667eea;
background:linear-gradient(135deg,#667eea,#764ba2);
margin:0;
padding:20px;
}

.card{
background:white;
padding:20px;
border-radius:10px;
margin-bottom:20px;
box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

button{
padding:8px 12px;
border:none;
background:#667eea;
color:white;
border-radius:6px;
cursor:pointer;
}

input,select{
padding:6px;
margin:3px;
}

table{
width:100%;
border-collapse:collapse;
}

td,th{
padding:6px;
border-bottom:1px solid #ddd;
text-align:left;
}

.nav button{
margin-right:10px;
}
</style>

</head>
<body>

<div class="nav">
<button onclick="show('add')">Add Labour</button>
<button onclick="show('today')">Today Attendance</button>
<button onclick="show('report')">Salary Report</button>
</div>

<div id="add" class="card">

<h3>Add Labour</h3>

<input id="name" placeholder="Name">
<input id="rate" placeholder="Hourly Salary">
<input id="phone" placeholder="Phone">

<select id="type">
<option value="hourly">Hourly</option>
<option value="fixed">Fixed Salary</option>
</select>

<input id="fixedSalary" placeholder="Monthly Salary">

<button onclick="addLabour()">Add</button>

</div>

<div id="today" class="card" style="display:none">

<h3>Today Attendance</h3>

<table id="attendanceTable"></table>

</div>

<div id="report" class="card" style="display:none">

<h3>Salary Report</h3>

<input type="date" id="reportDate">

<button onclick="generateReport()">Generate</button>

<div id="salaryList"></div>

</div>

<script>

let labour=JSON.parse(localStorage.getItem("labour")||"[]")
let attendance=JSON.parse(localStorage.getItem("attendance")||"[]")
let advance=JSON.parse(localStorage.getItem("advance")||"[]")

function save(){
localStorage.setItem("labour",JSON.stringify(labour))
localStorage.setItem("attendance",JSON.stringify(attendance))
localStorage.setItem("advance",JSON.stringify(advance))
}

function show(id){

document.getElementById("add").style.display="none"
document.getElementById("today").style.display="none"
document.getElementById("report").style.display="none"

document.getElementById(id).style.display="block"

if(id=="today"){loadAttendance()}

}

function addLabour(){

let l={
name:name.value,
rate:rate.value,
phone:phone.value,
type:type.value,
fixedSalary:fixedSalary.value
}

labour.push(l)

save()

alert("Added")

}

function loadAttendance(){

let table="<tr><th>Name</th><th>Status</th><th>Hours</th><th>Min</th><th>Advance</th></tr>"

let today=new Date().toISOString().slice(0,10)

labour.forEach((l,i)=>{

table+=`
<tr>
<td>${l.name}</td>
<td>
<select onchange="mark(${i},this.value)">
<option>P</option>
<option>A</option>
</select>
</td>

<td><input type="number" id="h${i}" style="width:60px"></td>

<td><input type="number" id="m${i}" style="width:60px"></td>

<td><input type="number" id="adv${i}" style="width:80px"></td>

</tr>
`

})

table+=`</table><button onclick="saveToday()">Save Today</button>`

attendanceTable.innerHTML=table

}

let status={}

function mark(i,v){
status[i]=v
}

function saveToday(){

let today=new Date().toISOString().slice(0,10)

labour.forEach((l,i)=>{

let h=document.getElementById("h"+i).value||0
let m=document.getElementById("m"+i).value||0
let adv=document.getElementById("adv"+i).value||0

attendance.push({
name:l.name,
date:today,
status:status[i]||"P",
hours:parseFloat(h),
min:parseFloat(m)
})

if(adv>0){

advance.push({
name:l.name,
amount:parseFloat(adv)
})

}

})

save()

alert("Saved")

}

function generateReport(){

let html=""

labour.forEach(l=>{

let total=0

attendance.forEach(a=>{

if(a.name==l.name && a.status=="P"){

let hrs=a.hours+(a.min/60)

if(l.type=="hourly"){

total+=hrs*l.rate

}

}

})

if(l.type=="fixed"){
total=l.fixedSalary
}

let adv=0

advance.forEach(v=>{
if(v.name==l.name){adv+=v.amount}
})

let final=total-adv

let msg=`Salary ${l.name}
Total ₹${total}
Advance ₹${adv}
Pay ₹${final}`

let wa=`https://wa.me/${l.phone}?text=${encodeURIComponent(msg)}`

html+=`
<div class="card">
<b>${l.name}</b><br>
Total: ₹${total}<br>
Advance: ₹${adv}<br>
Final: ₹${final}<br>
<a href="${wa}" target="_blank">Send WhatsApp</a>
</div>
`

})

salaryList.innerHTML=html

}

</script>

</body>
</html>
