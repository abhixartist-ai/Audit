<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amazon Label Tool Pro</title><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script><style>
body {margin:0;font-family:Arial;background:#0f172a;color:white}
.card {background:#1e293b;margin:15px;padding:20px;border-radius:15px}
#dropZone {border:2px dashed #555;padding:40px;text-align:center;border-radius:10px;transition:0.3s}
#dropZone.drag {background:#334155}
#dropZone.done {background:#065f46}
button {margin:10px;padding:12px 20px;border:none;border-radius:10px;background:#6366f1;color:white;cursor:pointer}
#loader {display:none;text-align:center}
.menu {position:fixed;top:0;left:0;width:250px;height:100%;background:#020617;transform:translateX(-100%);transition:0.3s;padding:20px}
.menu.active {transform:translateX(0)}
.hamburger {position:fixed;top:10px;left:10px;font-size:24px;cursor:pointer}
</style></head>
<body><div class="hamburger" onclick="toggleMenu()">☰</div>
<div class="menu" id="menu"><h3>Menu</h3></div><div class="card" id="greeting"></div><div class="card">
<h3>Upload PDF</h3>
<div id="dropZone">Drag & Drop PDF</div>
<input type="file" id="pdfInput" hidden accept="application/pdf">
</div><div class="card">
<button onclick="labelOnly()">1. Label Generate</button>
<button onclick="cropPDF()">2. Crop PDF</button>
<button onclick="exportExcel()">3. Export Excel</button>
</div><div id="loader">Processing...</div><script>
let pdfFile, skuMap = {};

// 🔥 AUTO LOAD CSV FROM GITHUB
fetch("sku_map.csv")
.then(res=>res.text())
.then(csv=>{
let data = Papa.parse(csv, {header:true}).data;
data.forEach(r=>{
if(r.SKU) skuMap[r.SKU.trim()] = r.REPLACEMENT;
});
console.log("SKU MAP LOADED", skuMap);
});

function toggleMenu(){document.getElementById("menu").classList.toggle("active")}

function greeting(){
let h=new Date().getHours(),msg="Good Evening";
if(h<12)msg="Good Morning";else if(h<18)msg="Good Afternoon";
let now=new Date();
document.getElementById("greeting").innerHTML=`<h2>${msg}</h2><p>${now.toDateString()}</p><p>${now.toLocaleTimeString()}</p>`
}
greeting();

let dz=document.getElementById("dropZone"),pdfInput=document.getElementById("pdfInput");
dz.onclick=()=>pdfInput.click();
pdfInput.onchange=e=>loadPDF(e.target.files[0]);

dz.ondragover=e=>{e.preventDefault();dz.classList.add("drag")}
dz.ondragleave=()=>dz.classList.remove("drag")
dz.ondrop=e=>{e.preventDefault();dz.classList.remove("drag");loadPDF(e.dataTransfer.files[0])}

function loadPDF(f){pdfFile=f;dz.classList.add("done")}

async function readPDF(){
let reader=new FileReader();
reader.readAsArrayBuffer(pdfFile);
return new Promise(resolve=>{
reader.onload=async function(){
let pdf=await pdfjsLib.getDocument({data:reader.result}).promise;
let rows=[];

for(let i=1;i<=pdf.numPages;i++){
let page=await pdf.getPage(i);
let txt=await page.getTextContent();
let str=txt.items.map(x=>x.str).join(" ");

let orderId=(str.match(/Order\s*ID[:\s]*([A-Z0-9-]+)/i)||[])[1]||"";
let shipDate=(str.match(/Ship\s*Date[:\s]*([0-9\/-]+)/i)||[])[1]||"";
let orderDate=(str.match(/Order\s*Date[:\s]*([0-9\/-]+)/i)||[])[1]||"";

let skuMatches=[...str.matchAll(/SKU[:\s]*([A-Z0-9-]+)/gi)];
let qtyMatches=[...str.matchAll(/Qty[:\s]*(\d+)/gi)];

for(let j=0;j<skuMatches.length;j++){
let sku=skuMatches[j][1];
let qty=parseInt(qtyMatches[j]?.[1]||1);
let replacement=skuMap[sku]||"";

let pack=1;
let m=replacement.match(/-(\d+)/);
if(m) pack=parseInt(m[1]);

rows.push({
orderId, shipDate, orderDate, sku, replacement, qty, pcs:pack*qty
});
}
}
resolve(rows);
}
});
}

// 1️⃣ LABEL FUNCTION
async function labelOnly(){
if(!pdfFile) return alert("Upload PDF first");
document.getElementById("loader").style.display="block";

let rows = await readPDF();

let text="";
rows.forEach(r=>{
text += `${r.replacement} (${r.pcs} pcs)\n`;
});

console.log("LABEL TEXT:\n", text);
alert("Label text console me generate ho gaya");

document.getElementById("loader").style.display="none";
}

// 2️⃣ CROP FUNCTION
function cropPDF(){
alert("Crop feature next upgrade me add hoga (exact center crop)");
}

// 3️⃣ EXCEL EXPORT
async function exportExcel(){
if(!pdfFile) return alert("Upload PDF first");
document.getElementById("loader").style.display="block";

let rows = await readPDF();

let formatted = rows.map(r=>({
"Order ID":r.orderId,
"Ship Date":r.shipDate,
"Order Date":r.orderDate,
"SKU":r.sku,
"Replacement":r.replacement,
"Qty":r.qty,
"Pack*Qty":r.pcs
}));

let ws=XLSX.utils.json_to_sheet(formatted);
let wb=XLSX.utils.book_new();
XLSX.utils.book_append_sheet(wb,ws,"Orders");
XLSX.writeFile(wb,"Amazon_Data.xlsx");


document.getElementById("loader").style.display="none";
}

</script></body>
</html>
