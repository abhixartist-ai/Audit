<!DOCTYPE html>
<html>
<head>
<title>Employee Attendance System</title>

<style>

body{
font-family:Arial;
background:#f4f6fb;
margin:0;
}

header{
background:linear-gradient(90deg,#667eea,#764ba2);
color:white;
padding:15px;
font-size:22px;
}

nav{
background:white;
padding:10px;
box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

button{
padding:8px 14px;
margin:4px;
cursor:pointer;
}

.container{
padding:20px;
}

.card{
background:white;
padding:15px;
border-radius:6px;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
margin-bottom:20px;
}

table{
width:100%;
border-collapse:collapse;
}

table th,table td{
border:1px solid #ddd;
padding:8px;
}

input,select{
padding:6px;
width:100%;
}

.hidden{
display:none;
}

</style>

</head>

<body>

<header>Employee Attendance System</header>

<nav>
<button onclick="showScreen('employee')">Employee</button>
<button onclick="showScreen('attendance')">Attendance</button>
<button onclick="showScreen('report')">Report</button>
</nav>

<div class="container">

<!-- Employee Screen -->

<div id="employee" class="card">

<h3>Add Employee</h3>

<input id="empName" placeholder="Name"><br><br>
<input id="empPhone" placeholder="Mobile"><br><br>

<select id="salaryMode">
<option>Weekly</option>
<option>15+MonthEnd</option>
<option>MonthEnd</option>
</select><br><br>

<select id="paymentType">
<option>Hourly</option>
<option>Fixed</option>
</select><br><br>

<input id="hourRate" placeholder="Hour Rate"><br><br>
<input id="fixedSalary" placeholder="Fixed Salary"><br><br>

<button onclick="addEmployee()">Add Employee</button>

<h3>Employee List</h3>

<table>
<thead>
<tr>
<th>Name</th>
<th>Type</th>
<th>Mode</th>
<th>Action</th>
</tr>
</thead>

<tbody id="empTable"></tbody>

</table>

</div>

<!-- Attendance Screen -->

<div id="attendance" class="card hidden">

<h3>Attendance</h3>

<input type="date" id="attDate"><br><br>

<select id="attEmp"></select><br><br>

<input id="status" placeholder="A / P"><br><br>

<input id="hours" placeholder="Hours (Default 10)"><br><br>

<input id="remark" placeholder="Remark"><br><br>

<button onclick="saveAttendance()">Save Attendance</button>

</div>

<!-- Report Screen -->

<div id="report" class="card hidden">

<h3>Report</h3>

<select id="repEmp"></select>

<button onclick="generateReport()">Generate</button>

<table>
<thead>
<tr>
<th>Date</th>
<th>Hours</th>
</tr>
</thead>

<tbody id="reportTable"></tbody>

</table>

<br>

<b>Total Hours:</b> <span id="totalHours"></span><br>
<b>Total Salary:</b> <span id="totalSalary"></span>

</div>

</div>

<script>

let employees=JSON.parse(localStorage.getItem("employees")||"[]")
let attendance=JSON.parse(localStorage.getItem("attendance")||"[]")

function saveData(){
localStorage.setItem("employees",JSON.stringify(employees))
localStorage.setItem("attendance",JSON.stringify(attendance))
}

function showScreen(id){

document.getElementById("employee").classList.add("hidden")
document.getElementById("attendance").classList.add("hidden")
document.getElementById("report").classList.add("hidden")

document.getElementById(id).classList.remove("hidden")

}

function addEmployee(){

let emp={
id:Date.now(),
name:empName.value,
phone:empPhone.value,
mode:salaryMode.value,
type:paymentType.value,
rate:Number(hourRate.value),
salary:Number(fixedSalary.value)
}

employees.push(emp)

saveData()

loadEmployees()

}

function deleteEmp(id){

employees=employees.filter(e=>e.id!=id)

saveData()

loadEmployees()

}

function loadEmployees(){

let html=""

employees.forEach(e=>{

html+=`
<tr>
<td>${e.name}</td>
<td>${e.type}</td>
<td>${e.mode}</td>
<td><button onclick="deleteEmp(${e.id})">Delete</button></td>
</tr>
`

})

empTable.innerHTML=html

let options=""

employees.forEach(e=>{

options+=`<option value="${e.id}">${e.name}</option>`

})

attEmp.innerHTML=options
repEmp.innerHTML=options

}

function saveAttendance(){

let st=status.value.toUpperCase()

let hr=hours.value

if(st=="P" && hr=="") hr=10
if(st=="A") hr=0

attendance.push({

date:attDate.value,
emp:attEmp.value,
hours:Number(hr),
remark:remark.value

})

saveData()

alert("Saved")

}

function generateReport(){

let id=repEmp.value

let emp=employees.find(e=>e.id==id)

let data=attendance.filter(a=>a.emp==id)

let html=""

let total=0

data.forEach(d=>{

html+=`
<tr>
<td>${d.date}</td>
<td>${d.hours}</td>
</tr>
`

total+=d.hours

})

reportTable.innerHTML=html

totalHours.innerText=total

let salary=0

if(emp.type=="Hourly")
salary=total*emp.rate
else
salary=emp.salary

totalSalary.innerText=salary

}

loadEmployees()

attDate.valueAsDate=new Date()

</script>

</body>

</html>
