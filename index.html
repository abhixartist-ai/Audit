<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Labour Attendance Manager</title>
<style>
body{
font-family:Arial;
background:linear-gradient(135deg,#667eea,#764ba2);
margin:0;
color:#333;
}
.container{
background:white;
margin:15px;
padding:15px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,0.2);
}
h2{margin-top:0}
input,select,button{
padding:8px;
margin:5px 0;
width:100%;
}
button{
background:#667eea;
color:white;
border:none;
border-radius:5px;
}
table{
width:100%;
border-collapse:collapse;
}
td,th{
border-bottom:1px solid #ddd;
padding:8px;
}
.nav{
display:flex;
background:#333;
}
.nav button{
flex:1;
border-radius:0;
background:#333;
}
</style>
</head>

<body>

<div class="nav">
<button onclick="show('today')">Today</button>
<button onclick="show('add')">Add Labour</button>
<button onclick="show('report')">Report</button>
</div>

<!-- Add Labour -->
<div id="add" class="container" style="display:none">
<h2>Add Labour</h2>

<input id="name" placeholder="Name">
<input id="salary" placeholder="Hourly Salary">
<input id="contact" placeholder="WhatsApp Number">

<select id="type">
<option value="hourly">Hourly Salary</option>
<option value="fixed">Fixed Salary</option>
</select>

<button onclick="addLabour()">Add Labour</button>
</div>

<!-- Today Attendance -->
<div id="today" class="container">
<h2>Today Attendance</h2>

<input type="date" id="date">

<div id="list"></div>

</div>

<!-- Report -->
<div id="report" class="container" style="display:none">

<h2>Salary Report</h2>

<input type="month" id="month">

<button onclick="generateReport()">Calculate</button>

<div id="salaryReport"></div>

</div>

<script>

let labour=JSON.parse(localStorage.getItem("labour")||"[]")
let attendance=JSON.parse(localStorage.getItem("attendance")||"[]")
let advance=JSON.parse(localStorage.getItem("advance")||"[]")

document.getElementById("date").valueAsDate=new Date()

function save(){
localStorage.setItem("labour",JSON.stringify(labour))
localStorage.setItem("attendance",JSON.stringify(attendance))
localStorage.setItem("advance",JSON.stringify(advance))
}

function show(x){
document.getElementById("today").style.display="none"
document.getElementById("add").style.display="none"
document.getElementById("report").style.display="none"

document.getElementById(x).style.display="block"

if(x=="today")loadToday()
}

function addLabour(){

let l={
name:name.value,
salary:Number(salary.value),
contact:contact.value,
type:type.value
}

labour.push(l)

save()

alert("Labour Added")

loadToday()

}

function loadToday(){

let d=document.getElementById("date").value

let html="<table><tr><th>Name</th><th>Status</th><th>Hours</th><th>Advance</th></tr>"

labour.forEach((l,i)=>{

html+=`
<tr>
<td>${l.name}</td>

<td>
<select onchange="setStatus(${i},this.value)">
<option value="">-</option>
<option>Present</option>
<option>Absent</option>
</select>
</td>

<td>
<input type="number" placeholder="Hours" onchange="setHour(${i},this.value)">
</td>

<td>
<input type="number" placeholder="Advance" onchange="setAdvance(${i},this.value)">
</td>

</tr>
`

})

html+="</table>"

document.getElementById("list").innerHTML=html

}

function setStatus(i,val){

attendance.push({
name:labour[i].name,
date:date.value,
status:val,
hours:0
})

save()

}

function setHour(i,val){

attendance.push({
name:labour[i].name,
date:date.value,
status:"Present",
hours:Number(val)
})

save()

}

function setAdvance(i,val){

advance.push({
name:labour[i].name,
amount:Number(val),
date:date.value
})

save()

}

function generateReport(){

let m=document.getElementById("month").value

let html="<table><tr><th>Name</th><th>Salary</th><th>Advance</th><th>Total</th><th>Send</th></tr>"

labour.forEach(l=>{

let hours=0

attendance.forEach(a=>{
if(a.name==l.name && a.date.startsWith(m)){
hours+=a.hours
}
})

let sal=l.type=="fixed"?l.salary:(hours*l.salary)

let adv=0

advance.forEach(a=>{
if(a.name==l.name){
adv+=a.amount
}
})

let total=sal-adv

let msg=`Salary report
Name: ${l.name}
Salary: ${sal}
Advance: ${adv}
Total: ${total}`

let link=`https://wa.me/${l.contact}?text=`+encodeURIComponent(msg)

html+=`
<tr>
<td>${l.name}</td>
<td>${sal}</td>
<td>${adv}</td>
<td>${total}</td>
<td><a href="${link}" target="_blank">WhatsApp</a></td>
</tr>
`

})

html+="</table>"

salaryReport.innerHTML=html

}

loadToday()

</script>

</body>
</html>
