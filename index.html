<!DOCTYPE html>
<html>
<head>

<title>Amazon Label SKU Tool</title>

<script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>

<style>

body{
font-family:Arial;
padding:20px;
background:#f5f6ff;
}

button{
padding:10px 20px;
background:#667eea;
color:white;
border:none;
margin-top:10px;
}

</style>

</head>

<body>

<h2>Upload Amazon Label PDF</h2>

<input type="file" id="upload">

<button onclick="processPDF()">Create Label PDF</button>

<script>

let fileBuffer

document.getElementById("upload").addEventListener("change",function(e){

let reader=new FileReader()

reader.onload=function(){
fileBuffer=this.result
}

reader.readAsArrayBuffer(e.target.files[0])

})

async function processPDF(){

const pdfDoc=await PDFLib.PDFDocument.load(fileBuffer)

const pages=pdfDoc.getPages()

let skuText="SKU C9-R9K1-M7M6 (2×1=2)"

for(let i=0;i<pages.length;i++){

let page=pages[i]

page.drawText(skuText,{

x:60,
y:140,
size:12

})

}

const pdfBytes=await pdfDoc.save()

let blob=new Blob([pdfBytes],{type:"application/pdf"})

let link=document.createElement("a")

link.href=URL.createObjectURL(blob)

link.download="amazon_labels.pdf"

link.click()

}

</script>

</body>
</html>
