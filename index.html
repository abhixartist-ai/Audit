<!DOCTYPE html>
<html>
<head>

<title>Amazon Label Tool</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>

<style>
body{
font-family:Arial;
padding:20px;
background:#f4f6ff;
}

button{
padding:10px 20px;
background:#667eea;
color:white;
border:none;
cursor:pointer;
margin-top:10px;
}
</style>

</head>

<body>

<h3>Upload Amazon Order PDF</h3>
<input type="file" id="pdfUpload">

<br><br>

<h3>Upload SKU Replacement CSV</h3>
<input type="file" id="csvUpload">

<br><br>

<button onclick="processPDF()">Generate Labels</button>

<script>

let pdfBuffer
let skuMap={}

document.getElementById("pdfUpload").addEventListener("change",function(e){

let reader=new FileReader()

reader.onload=function(){
pdfBuffer=this.result
}

reader.readAsArrayBuffer(e.target.files[0])

})

document.getElementById("csvUpload").addEventListener("change",function(e){

let reader=new FileReader()

reader.onload=function(){

let rows=this.result.split("\n")

rows.slice(1).forEach(r=>{

let col=r.split(",")

if(col.length>=2){

let sku=col[0].trim()
let rep=col[1].trim()

skuMap[sku]=rep

}

})

}

reader.readAsText(e.target.files[0])

})

async function processPDF(){

const loadingTask = pdfjsLib.getDocument({data: pdfBuffer})
const pdf = await loadingTask.promise

const newPdf = await PDFLib.PDFDocument.create()

let storedLabel=null

for(let i=1;i<=pdf.numPages;i++){

const page = await pdf.getPage(i)
const textContent = await page.getTextContent()

let text=textContent.items.map(i=>i.str).join(" ")

if(text.includes("Tax Invoice")){

let skuMatch=text.match(/\(\s*([A-Z0-9\-]+)\s*\)/)
let qtyMatch=text.match(/₹[\d\.]+\s+(\d+)\s+₹/)

let sku=skuMatch ? skuMatch[1] : ""
let qty=qtyMatch ? parseInt(qtyMatch[1]) : 1

let replacement=skuMap[sku] || sku

let packMatch=replacement.match(/(\d+)$/)

let pack=packMatch ? parseInt(packMatch[1]) : 1

let pcs=pack*qty

let printText=`${replacement} ×${qty} (${pcs})`

if(storedLabel!=null){

const originalPdf=await PDFLib.PDFDocument.load(pdfBuffer)

const [copiedPage]=await newPdf.copyPages(originalPdf,[storedLabel])

newPdf.addPage(copiedPage)

let pages=newPdf.getPages()
let lastPage=pages[pages.length-1]

lastPage.drawText(printText,{
x:60,
y:140,
size:12
})

storedLabel=null

}

}else{

storedLabel=i-1

}

}

const pdfBytes=await newPdf.save()

let blob=new Blob([pdfBytes],{type:"application/pdf"})

let link=document.createElement("a")

link.href=URL.createObjectURL(blob)

link.download="labels.pdf"

link.click()

}

</script>

</body>
</html>
