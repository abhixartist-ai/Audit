<!DOCTYPE html>
<html>
<head>
<title>Amazon Invoice Summary Tool</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

<style>

body{
font-family:Arial;
background:#f4f6ff;
padding:20px;
}

h2{
color:#333;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
background:white;
}

th,td{
border:1px solid #ccc;
padding:10px;
text-align:center;
}

th{
background:#667eea;
color:white;
}

input{
margin-top:10px;
}

</style>

</head>

<body>

<h2>Amazon Order PDF Summary</h2>

<input type="file" id="pdfUpload">

<table id="resultTable">
<tr>
<th>S.No</th>
<th>SKU</th>
<th>Pack</th>
<th>Qty</th>
<th>Total Pieces</th>
</tr>
</table>

<script>

let table = document.getElementById("resultTable")
let count = 1

document.getElementById("pdfUpload").addEventListener("change", function(e){

let file = e.target.files[0]
let reader = new FileReader()

reader.onload = function(){

let typedarray = new Uint8Array(this.result)

pdfjsLib.getDocument(typedarray).promise.then(function(pdf){

for(let i=1;i<=pdf.numPages;i++){

pdf.getPage(i).then(function(page){

page.getTextContent().then(function(text){

let content = text.items.map(item => item.str).join(" ")

processInvoice(content)

})

})

}

})

}

reader.readAsArrayBuffer(file)

})

function processInvoice(text){

if(!text.includes("Tax Invoice")) return

let skuMatch = text.match(/\(\s*([A-Z0-9\-]+)\s*\)/)
let packMatch = text.match(/(\d+)\s*Pack/i)
let qtyMatch = text.match(/₹[\d\.]+\s+(\d+)\s+₹/)

let sku = skuMatch ? skuMatch[1] : "Unknown"
let pack = packMatch ? parseInt(packMatch[1]) : 1
let qty = qtyMatch ? parseInt(qtyMatch[1]) : 1

let pieces = pack * qty

let row = table.insertRow()

row.insertCell(0).innerHTML = count++
row.insertCell(1).innerHTML = sku
row.insertCell(2).innerHTML = pack
row.insertCell(3).innerHTML = qty
row.insertCell(4).innerHTML = pieces

}

</script>

</body>
</html>
