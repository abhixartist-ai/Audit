<!DOCTYPE html>
<html>
<head>

<title>Label Tool Pro</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
</script>

<script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
body{
font-family:Poppins, sans-serif;
margin:0;padding:20px;
background:linear-gradient(135deg,#0f172a,#2f0130);
color:white;
}
.container{max-width:650px;margin:auto;}
.card{
background:#1e2633;
padding:25px;border-radius:20px;margin-top:20px;
}
.btn{
width:100%;padding:12px;margin-top:10px;
border:none;border-radius:12px;
background:linear-gradient(90deg,#6a8cff,#721978);
color:white;font-weight:bold;cursor:pointer;
}
#dropZone{
border:2px dashed #6a8cff;
padding:30px;text-align:center;border-radius:15px;
cursor:pointer;margin-top:20px;
}
#loginBox{
position:fixed;top:0;left:0;width:100%;height:100%;
background:#0f172a;display:flex;justify-content:center;align-items:center;
}
</style>
</head>

<body>

<div id="loginBox">
  <div class="card">
    <h2>Enter Password</h2>
    <input type="password" id="passInput">
    <button class="btn" onclick="checkPassword()">Enter</button>
    <p id="errorMsg"></p>
  </div>
</div>

<div class="container">

<div class="card">
  <h2>Label Tool</h2>

  <div id="dropZone">
    <input type="file" id="pdfUpload" accept="application/pdf" hidden>
    Click or Upload PDF
  </div>

  <p id="status"></p>

  <button class="btn" onclick="processPDF()">Print Labels</button>
  <button class="btn" onclick="downloadSummary()">Download Excel</button>

</div>

</div>

<script>

/* GLOBAL */
let pdfBuffer=null
let summary=[]
let serial=1
let orderNumber=1
let today=new Date().toISOString().slice(0,10)

/* FILE UPLOAD */
const upload=document.getElementById("pdfUpload")
const dropZone=document.getElementById("dropZone")

dropZone.onclick=()=>upload.click()

upload.addEventListener("change",handleFile)

function handleFile(e){
let file=e.target.files[0]
if(!file)return
let reader=new FileReader()
reader.onload=()=>{
pdfBuffer=reader.result
document.getElementById("status").innerText="PDF Loaded ✅"
}
reader.readAsArrayBuffer(file)
}

/* LOGIN */
function checkPassword(){
if(document.getElementById("passInput").value==="1234"){
document.getElementById("loginBox").style.display="none"
}else{
document.getElementById("errorMsg").innerText="Wrong Password"
}
}

/* EXTRACT */
async function extractData(){
if(!pdfBuffer){alert("Upload PDF");return}

summary=[];serial=1;orderNumber=1

const pdf=await pdfjsLib.getDocument({data:pdfBuffer}).promise

for(let i=1;i<=pdf.numPages;i++){
const page=await pdf.getPage(i)
const text=(await page.getTextContent()).items.map(i=>i.str).join(" ")

if(!text.includes("Tax Invoice")){
if(i>=pdf.numPages) continue

const invoice=await pdf.getPage(i+1)
const invText=(await invoice.getTextContent()).items.map(i=>i.str).join(" ")

if(!invText.includes("Tax Invoice")) continue

let orderId=(invText.match(/Order.*?:\s*([A-Z0-9\-]+)/)||[])[1]||""
let orderDate=(invText.match(/Order Date.*?:\s*([\d\/\-]+)/)||[])[1]||""
let total=(invText.match(/Total.*?₹\s*([\d,\.]+)/)||[])[1]||""
let gross=(invText.match(/(Grand|Gross).*?₹\s*([\d,\.]+)/)||[])[2]||""

let sku=[...invText.matchAll(/\(\s*([A-Z0-9\-]+)\s*\)/g)]
let qty=[...invText.matchAll(/₹[\d\.]+\s+(\d+)\s+₹/g)]

for(let k=0;k<sku.length;k++){
let s=sku[k][1]
let q=qty[k]?parseInt(qty[k][1]):1

summary.push({
order:k==0?orderNumber:"",
orderId:k==0?orderId:"",
orderDate:k==0?orderDate:"",
total:k==0?total:"",
gross:k==0?gross:"",
sno:serial++,
sku:s,
qty:q,
pcs:q
})
}
orderNumber++
}
}
}

/* PRINT */
async function processPDF(){
await extractData()
alert("Print Ready (you can extend)")
}

/* EXCEL */
async function downloadSummary(){
await extractData()

let data=[["Order No","Order ID","Order Date","Total","Gross Total","S.No","SKU","Qty","PCS"]]

summary.forEach(r=>{
data.push([r.order,r.orderId,r.orderDate,r.total,r.gross,r.sno,r.sku,r.qty,r.pcs])
})

let ws=XLSX.utils.aoa_to_sheet(data)
let wb=XLSX.utils.book_new()
XLSX.utils.book_append_sheet(wb,ws,"Summary")

XLSX.writeFile(wb,"Summary_"+today+".xlsx")
}

</script>

</body>
</html>
