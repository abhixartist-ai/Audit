<!DOCTYPE html>
<html>
<head>
<title>Employee Attendance System</title>

<style>

body{
font-family:Arial;
margin:0;
background:#f2f4ff;
}

header{
background:linear-gradient(90deg,#667eea,#764ba2);
color:white;
padding:15px;
font-size:22px;
}

nav{
background:white;
padding:10px;
box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

button{
padding:6px 12px;
cursor:pointer;
}

.container{
padding:20px;
}

.card{
background:white;
padding:20px;
border-radius:6px;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}

th,td{
border:1px solid #ddd;
padding:6px;
text-align:center;
}

input,select{
padding:5px;
}

.hidden{
display:none;
}

</style>

</head>

<body>

<header>Employee Attendance System</header>

<nav>
<button onclick="show('emp')">Employee</button>
<button onclick="show('att')">Attendance</button>
<button onclick="show('rep')">Report</button>
</nav>

<div class="container">

<!-- Employee -->

<div id="emp" class="card">

<h3>Add Employee</h3>

Name <input id="name">
Phone <input id="phone">

Salary Mode
<select id="mode">
<option>Weekly</option>
<option>15+MonthEnd</option>
<option>MonthEnd</option>
</select>

Payment
<select id="type">
<option>Hourly</option>
<option>Fixed</option>
</select>

Hour Rate <input id="rate">
Fixed Salary <input id="salary">

<button onclick="addEmp()">Add</button>

<h3>Employee List</h3>

<table>
<thead>
<tr>
<th>Name</th>
<th>Type</th>
<th>Mode</th>
<th>Edit</th>
<th>Delete</th>
</tr>
</thead>

<tbody id="empTable"></tbody>

</table>

</div>

<!-- Attendance -->

<div id="att" class="card hidden">

Date
<input type="date" id="attDate">

<table>

<thead>
<tr>
<th>Employee</th>
<th>A/P</th>
<th>Hours</th>
<th>Remark</th>
</tr>
</thead>

<tbody id="attTable"></tbody>

</table>

<button onclick="saveAtt()">Save Attendance</button>

</div>

<!-- Report -->

<div id="rep" class="card hidden">

Employee
<select id="repEmp"></select>

<button onclick="report()">Generate</button>

<table>

<thead>
<tr>
<th>Date</th>
<th>Hours</th>
</tr>
</thead>

<tbody id="repTable"></tbody>

</table>

<br>

Total Hours : <b id="totH"></b>

<br>

Total Salary : <b id="totS"></b>

<br><br>

Salary Status
<select id="salaryStatus">
<option>Current</option>
<option>Pending</option>
<option>Paid</option>
</select>

<label>
<input type="checkbox" id="paidChk"> Paid
</label>

<button onclick="saveSalary()">Save Status</button>

</div>

</div>

<script>

let employees=JSON.parse(localStorage.getItem("emp")||"[]")
let attendance=JSON.parse(localStorage.getItem("att")||"[]")
let salaryStatus=JSON.parse(localStorage.getItem("salary")||"[]")

function save(){
localStorage.setItem("emp",JSON.stringify(employees))
localStorage.setItem("att",JSON.stringify(attendance))
localStorage.setItem("salary",JSON.stringify(salaryStatus))
}

function show(id){

emp.classList.add("hidden")
att.classList.add("hidden")
rep.classList.add("hidden")

document.getElementById(id).classList.remove("hidden")

if(id=="att") loadAtt()
if(id=="rep") loadRep()

}

function addEmp(){

employees.push({

id:Date.now(),
name:name.value,
phone:phone.value,
mode:mode.value,
type:type.value,
rate:Number(rate.value),
salary:Number(salary.value)

})

save()

loadEmp()

}

function loadEmp(){

let html=""

employees.forEach(e=>{

html+=`
<tr>
<td>${e.name}</td>
<td>${e.type}</td>
<td>${e.mode}</td>
<td><button onclick="editEmp(${e.id})">Edit</button></td>
<td><button onclick="delEmp(${e.id})">Delete</button></td>
</tr>
`

})

empTable.innerHTML=html

}

function delEmp(id){

employees=employees.filter(e=>e.id!=id)

save()

loadEmp()

}

function editEmp(id){

let e=employees.find(x=>x.id==id)

name.value=e.name
phone.value=e.phone
mode.value=e.mode
type.value=e.type
rate.value=e.rate
salary.value=e.salary

delEmp(id)

}

function loadAtt(){

let html=""

employees.forEach(e=>{

html+=`
<tr>
<td>${e.name}</td>
<td><input id="st_${e.id}" placeholder="P"></td>
<td><input id="hr_${e.id}" value="10"></td>
<td><input id="rm_${e.id}"></td>
</tr>
`

})

attTable.innerHTML=html

}

function saveAtt(){

let d=attDate.value

employees.forEach(e=>{

let st=document.getElementById("st_"+e.id).value
let hr=document.getElementById("hr_"+e.id).value
let rm=document.getElementById("rm_"+e.id).value

if(st=="A") hr=0

if(st!="")

attendance.push({

emp:e.id,
date:d,
hours:Number(hr),
remark:rm

})

})

save()

alert("Attendance Saved")

}

function loadRep(){

let opt=""

employees.forEach(e=>{

opt+=`<option value="${e.id}">${e.name}</option>`

})

repEmp.innerHTML=opt

}

function report(){

let id=repEmp.value

let emp=employees.find(e=>e.id==id)

let data=attendance.filter(a=>a.emp==id)

let html=""
let total=0

data.forEach(a=>{

html+=`
<tr>
<td>${a.date}</td>
<td>${a.hours}</td>
</tr>
`

total+=a.hours

})

repTable.innerHTML=html

totH.innerText=total

let salary=0

if(emp.type=="Hourly")
salary=total*emp.rate
else
salary=emp.salary

totS.innerText=salary

}

function saveSalary(){

salaryStatus.push({

emp:repEmp.value,
status:salaryStatus.value,
paid:paidChk.checked

})

save()

alert("Saved")

}

loadEmp()

attDate.valueAsDate=new Date()

</script>

</body>

</html>
