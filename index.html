<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Labour Payroll Manager</title>

<style>

body{
font-family:Arial;
background:linear-gradient(135deg,#667eea,#764ba2);
padding:20px;
}

.card{
background:white;
padding:20px;
border-radius:12px;
margin-bottom:20px;
box-shadow:0 6px 15px rgba(0,0,0,0.2);
}

button{
padding:7px 12px;
background:#667eea;
border:none;
color:white;
border-radius:6px;
cursor:pointer;
margin:2px;
}

input,select{
padding:6px;
margin:3px;
}

table{
width:100%;
border-collapse:collapse;
}

td,th{
padding:8px;
border-bottom:1px solid #ddd;
}

.nav button{
margin-right:10px;
}

</style>
</head>

<body>

<div class="nav">
<button onclick="showPage('labour')">Employees</button>
<button onclick="showPage('attendance')">Attendance</button>
<button onclick="showPage('report')">Salary Report</button>
</div>


<!-- EMPLOYEE MANAGEMENT -->

<div id="labour" class="card">

<h3>Employee</h3>

<input id="name" placeholder="Name">

<input id="phone" placeholder="Phone">

<input id="rate" type="number" placeholder="Hourly Rate">

<input id="fixedSalary" type="number" placeholder="Fixed Salary">

<br>

Salary Mode

<select id="salaryMode">
<option value="hourly">Hourly</option>
<option value="fixed">Fixed</option>
</select>

Payment Cycle

<select id="paymentCycle">
<option value="weekly">Weekly (Saturday)</option>
<option value="half">15 & Month End</option>
<option value="month">Month End</option>
</select>

<button onclick="addEmployee()">Add</button>

<table id="empTable"></table>

</div>


<!-- ATTENDANCE -->

<div id="attendance" class="card" style="display:none">

<h3>Attendance</h3>

Date

<input type="date" id="attDate">

<table id="attendanceTable"></table>

</div>


<!-- REPORT -->

<div id="report" class="card" style="display:none">

<h3>Salary Report</h3>

From <input type="date" id="fromDate">

To <input type="date" id="toDate">

<button onclick="generateReport()">Generate</button>

<div id="reportList"></div>

</div>


<script>

let employees=JSON.parse(localStorage.getItem("employees")||"[]")
let attendance=JSON.parse(localStorage.getItem("attendance")||"[]")
let advance=JSON.parse(localStorage.getItem("advance")||"[]")
let payments=JSON.parse(localStorage.getItem("payments")||"[]")

function save(){

localStorage.setItem("employees",JSON.stringify(employees))
localStorage.setItem("attendance",JSON.stringify(attendance))
localStorage.setItem("advance",JSON.stringify(advance))
localStorage.setItem("payments",JSON.stringify(payments))

}

function showPage(p){

document.getElementById("labour").style.display="none"
document.getElementById("attendance").style.display="none"
document.getElementById("report").style.display="none"

document.getElementById(p).style.display="block"

if(p=="labour") loadEmployees()
if(p=="attendance") loadAttendance()

}

function addEmployee(){

let emp={
name:name.value,
phone:phone.value,
rate:parseFloat(rate.value||0),
fixedSalary:parseFloat(fixedSalary.value||0),
salaryMode:salaryMode.value,
paymentCycle:paymentCycle.value
}

employees.push(emp)

save()

name.value=""
phone.value=""
rate.value=""
fixedSalary.value=""

loadEmployees()

}

function loadEmployees(){

let t="<tr><th>Name</th><th>Mode</th><th>Cycle</th><th>Action</th></tr>"

employees.forEach((e,i)=>{

t+=`

<tr>

<td>${e.name}</td>
<td>${e.salaryMode}</td>
<td>${e.paymentCycle}</td>

<td>

<button onclick="editEmp(${i})">Edit</button>
<button onclick="deleteEmp(${i})">Delete</button>

</td>

</tr>

`

})

empTable.innerHTML=t

}

function editEmp(i){

let e=employees[i]

name.value=e.name
phone.value=e.phone
rate.value=e.rate
fixedSalary.value=e.fixedSalary
salaryMode.value=e.salaryMode
paymentCycle.value=e.paymentCycle

employees.splice(i,1)

save()

}

function deleteEmp(i){

if(confirm("Delete employee?")){

employees.splice(i,1)

save()

loadEmployees()

}

}

function loadAttendance(){

let today=new Date().toISOString().slice(0,10)

attDate.value=today

let t="<tr><th>Name</th><th>Status</th><th>Hour</th><th>Min</th><th>Advance</th></tr>"

employees.forEach((e,i)=>{

t+=`

<tr>

<td>${e.name}</td>

<td>

<select id="s${i}">
<option value="P">Present</option>
<option value="A">Absent</option>
</select>

</td>

<td><input type="number" id="h${i}" value="10" style="width:60px"></td>

<td><input type="number" id="m${i}" value="0" style="width:60px"></td>

<td><input type="number" id="adv${i}" style="width:70px"></td>

</tr>

`

})

t+=`</table><button onclick="saveAttendance()">Save</button>`

attendanceTable.innerHTML=t

}

function saveAttendance(){

let d=attDate.value

employees.forEach((e,i)=>{

attendance.push({

name:e.name,
date:d,
status:document.getElementById("s"+i).value,
hours:parseFloat(document.getElementById("h"+i).value||0),
min:parseFloat(document.getElementById("m"+i).value||0)

})

let adv=document.getElementById("adv"+i).value

if(adv>0){

advance.push({

name:e.name,
amount:parseFloat(adv),
date:d

})

}

})

save()

alert("Saved")

}

function generateReport(){

let from=fromDate.value
let to=toDate.value

let html=""

employees.forEach(e=>{

let total=0
let totalHours=0

attendance.forEach(a=>{

if(a.name==e.name && a.date>=from && a.date<=to && a.status=="P"){

let hrs=a.hours+(a.min/60)

totalHours+=hrs

if(e.salaryMode=="hourly"){
total+=hrs*e.rate
}

}

})

if(e.salaryMode=="fixed"){
total=e.fixedSalary
}

let adv=0

advance.forEach(v=>{
if(v.name==e.name && v.date<=to){
adv+=v.amount
}
})

let final=total-adv

let paid=payments.find(p=>p.name==e.name && p.from==from && p.to==to)

let status=paid?"PAID":"UNPAID"

let msg=`Salary ${e.name}
${from} to ${to}
Hours ${totalHours}
Total ₹${total}
Advance ₹${adv}
Pay ₹${final}`

let wa=`https://wa.me/${e.phone}?text=${encodeURIComponent(msg)}`

html+=`

<div class="card">

<b>${e.name}</b><br>

Cycle: ${e.paymentCycle}<br>

Mode: ${e.salaryMode}<br>

Hours: ${totalHours}<br>

Total ₹${total}<br>

Advance ₹${adv}<br>

Final ₹${final}<br>

Status: ${status}

<br><br>

<button onclick="markPaid('${e.name}','${from}','${to}')">Mark Paid</button>

<a href="${wa}" target="_blank">WhatsApp</a>

</div>

`

})

reportList.innerHTML=html

}

function markPaid(name,from,to){

payments.push({

name:name,
from:from,
to:to

})

save()

alert("Marked Paid")

}

loadEmployees()

</script>

</body>
</html>
