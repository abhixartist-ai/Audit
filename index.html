<!DOCTYPE html><html>
<head>
<meta charset="UTF-8">
<title>Amazon / Flipkart Label & SKU Tool</title><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><style>
body{
font-family:Arial;
background:linear-gradient(135deg,#667eea,#764ba2);
padding:30px;
}

.card{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 10px 25px rgba(0,0,0,0.15);
max-width:900px;
margin:auto;
}

button,input,select{
padding:10px;
margin:10px;
}

button{cursor:pointer}

#preview canvas{
border:1px solid #ccc;
margin:10px;
max-width:100%;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th,td{
border:1px solid #ddd;
padding:8px;
}

th{background:#f5f5f5}

</style></head><body><div class="card"><h2>Amazon / Flipkart Label & SKU Tool</h2><select id="platform">
<option value="amazon">Amazon</option>
<option value="flipkart">Flipkart</option>
</select><br><input type="file" id="pdfUpload" accept="application/pdf"><br><button id="processBtn">Process File</button> <button onclick="downloadCSV()">Download SKU Summary</button>

<div id="preview"></div><h3>SKU Summary</h3><table id="summaryTable">
<thead>
<tr>
<th>SKU</th>
<th>Total Qty</th>
</tr>
</thead>
<tbody></tbody>
</table></div><script>

pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

let skuTotals = {}

document.getElementById("processBtn").addEventListener("click", processPDF)

async function processPDF(){

const fileInput = document.getElementById("pdfUpload")

if(fileInput.files.length === 0){
alert("Please upload PDF file first")
return
}

const file = fileInput.files[0]

skuTotals = {}

document.querySelector("#summaryTable tbody").innerHTML = ""

document.getElementById("preview").innerHTML = "Processing PDF..."

const arrayBuffer = await file.arrayBuffer()

const pdf = await pdfjsLib.getDocument({data:arrayBuffer}).promise

let fullText = ""

for(let page=1; page<=pdf.numPages; page++){

const p = await pdf.getPage(page)

const textContent = await p.getTextContent()

textContent.items.forEach(item=>{
fullText += item.str + " "
})

}

extractData(fullText)

}

function extractData(text){

// find all bracket values

let brackets = text.match(/([^()]*)/g)

if(!brackets){
alert("No SKU found in brackets")
return
}

brackets.forEach(b=>{

let sku = b.replace(/[()]/g,"").trim()

// ignore small text inside brackets

if(sku.length < 3) return

if(!skuTotals[sku]) skuTotals[sku] = 0

skuTotals[sku] += 1

})

updateSummary()

}

function updateSummary(){

const tbody = document.querySelector("#summaryTable tbody")

for(let sku in skuTotals){

let tr = document.createElement("tr")

tr.innerHTML = `<td>${sku}</td><td>${skuTotals[sku]}</td>`

tbody.appendChild(tr)

}

}

function downloadCSV(){

let csv = "SKU,Qty\n"

for(let sku in skuTotals){

csv += sku + "," + skuTotals[sku] + "\n"

}

const blob = new Blob([csv])

const a = document.createElement("a")

a.href = URL.createObjectURL(blob)

a.download = "sku-summary.csv"

a.click()

}

</script></body>
</html>
