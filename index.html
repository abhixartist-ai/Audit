<!DOCTYPE html>
<html>
<head>

<title>Amazon Label Tool</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
</script>

<script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>

body{
font-family:Arial;
padding:30px;
background:#f4f6ff;
}

#loginBox{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#f4f6ff;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:9999;
}

#dropZone{
border:2px dashed #667eea;
padding:40px;
text-align:center;
background:white;
margin-top:20px;
}

button{
padding:10px 20px;
background:#667eea;
color:white;
border:none;
cursor:pointer;
margin-top:10px;
}

</style>

</head>

<body>

<div id="loginBox">

<h2>Enter Password</h2>

<input type="password" id="passInput"
placeholder="Password"
style="padding:10px;font-size:16px;margin-bottom:10px;">

<button onclick="checkPassword()">Enter</button>

<p id="errorMsg" style="color:red;"></p>

</div>

<h2>Amazon Label Tool <span style="font-size:13px;color:#888;font-weight:normal;">  New Prospective Industries</span></h2>

<input type="file" id="pdfUpload">

<div id="dropZone">
Drag & Drop PDF Here
</div>

<br>

<button onclick="processPDF()">Generate Amazon Labels</button>
<button onclick="processFlipkart()">Flipkart Labels</button>
<button onclick="downloadSummary()">Download Summary Excel</button>

<p id="status"></p>

<script>

/* DATE FORMAT dd-mm-yy */

let d = new Date()
let day = String(d.getDate()).padStart(2,'0')
let month = String(d.getMonth()+1).padStart(2,'0')
let year = String(d.getFullYear()).slice(-2)
let today = day+"-"+month+"-"+year


function checkPassword(){

let pass=document.getElementById("passInput").value

if(pass==="1234"){
document.getElementById("loginBox").style.display="none"
}
else{
document.getElementById("errorMsg").innerText="Wrong Password"
}

}

/* ENTER LOGIN */

document.getElementById("passInput").addEventListener("keydown",function(e){
if(e.key==="Enter"){checkPassword()}
})

/* ENTER GENERATE */

document.addEventListener("keydown",function(e){
if(e.key==="Enter" && pdfBuffer){processPDF()}
})

let pdfBuffer
let skuMap={}
let summary=[]
let serial=1
let orderNumber=1
let boldFont

document.getElementById("pdfUpload").addEventListener("change",function(e){

let file=e.target.files[0]
let reader=new FileReader()

reader.onload=function(){
pdfBuffer=this.result
document.getElementById("status").innerText="PDF Loaded (Press Enter)"
}

reader.readAsArrayBuffer(file)

})


/* AMAZON LABEL PROCESS */

async function processPDF(){

summary=[]
serial=1
orderNumber=1

const loadingTask = pdfjsLib.getDocument({data: pdfBuffer})
const pdf = await loadingTask.promise

const newPdf = await PDFLib.PDFDocument.create()

boldFont = await newPdf.embedFont(PDFLib.StandardFonts.HelveticaBold)
const normalFont = await newPdf.embedFont(PDFLib.StandardFonts.Helvetica)

const originalPdf = await PDFLib.PDFDocument.load(pdfBuffer)

for(let i=1;i<=pdf.numPages;i++){

const [copiedPage]=await newPdf.copyPages(originalPdf,[i-1])
newPdf.addPage(copiedPage)

let pages=newPdf.getPages()
let lastPage=pages[pages.length-1]

let text="Amazon Order"

let y=180

let leftText = "SampleSKU ×1      "
let pcsText = "(4)"

lastPage.drawText(leftText,{
x:50,
y:y,
size:12,
font:normalFont
})

lastPage.drawText(pcsText,{
x:50 + leftText.length * 6,
y:y,
size:12,
font:boldFont
})

}

const pdfBytes=await newPdf.save()

let blob=new Blob([pdfBytes],{type:"application/pdf"})
let link=document.createElement("a")

link.href=URL.createObjectURL(blob)
link.download="Amazon_label_"+today+".pdf"
link.click()

document.getElementById("status").innerText="Amazon Labels Generated"

}


/* FLIPKART LABEL CROP */

async function processFlipkart(){

const loadingTask = pdfjsLib.getDocument({data: pdfBuffer})
const pdf = await loadingTask.promise

const newPdf = await PDFLib.PDFDocument.create()
const originalPdf = await PDFLib.PDFDocument.load(pdfBuffer)

for(let i=0;i<pdf.numPages;i++){

const [page]=await newPdf.copyPages(originalPdf,[i])

const {width,height}=page.getSize()

page.setCropBox(
185,
height-385,
410-185,
385-25
)

newPdf.addPage(page)

}

const pdfBytes=await newPdf.save()

let blob=new Blob([pdfBytes],{type:"application/pdf"})
let link=document.createElement("a")

link.href=URL.createObjectURL(blob)
link.download="Flipkart_label_"+today+".pdf"
link.click()

document.getElementById("status").innerText="Flipkart Labels Generated"

}


/* SUMMARY EXCEL */

function downloadSummary(){

let data=[["Order No","S.No","SKU","Replacement","Qty","Total PCS"]]

summary.forEach(r=>{
data.push([r.order,r.sno,r.sku,r.replacement,r.qty,r.pcs])
})

let ws=XLSX.utils.aoa_to_sheet(data)
let wb=XLSX.utils.book_new()

XLSX.utils.book_append_sheet(wb,ws,"Summary")

XLSX.writeFile(wb,"Amazon_summary_"+today+".xlsx")

}

</script>

</body>
</html>
