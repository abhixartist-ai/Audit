<!DOCTYPE html>
<html>
<head>
<title>Amazon Label Tool</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>

<style>
body{
font-family:Arial;
padding:20px;
background:#f4f6ff;
}

button{
padding:10px 20px;
background:#667eea;
color:white;
border:none;
cursor:pointer;
margin-top:10px;
}
</style>
</head>

<body>

<h2>Upload Amazon PDF</h2>

<input type="file" id="upload">

<br><br>

<button onclick="processPDF()">Generate Labels</button>

<script>

let pdfBuffer

document.getElementById("upload").addEventListener("change",function(e){

let reader=new FileReader()

reader.onload=function(){
pdfBuffer=this.result
}

reader.readAsArrayBuffer(e.target.files[0])

})

async function processPDF(){

const loadingTask = pdfjsLib.getDocument({data: pdfBuffer})
const pdf = await loadingTask.promise

const newPdf = await PDFLib.PDFDocument.create()

let storedLabelPage=null

for(let i=1;i<=pdf.numPages;i++){

const page = await pdf.getPage(i)
const textContent = await page.getTextContent()

let text = textContent.items.map(item=>item.str).join(" ")

if(text.includes("Tax Invoice")){

let skuMatch = text.match(/\(\s*([A-Z0-9\-]+)\s*\)/)
let packMatch = text.match(/(\d+)\s*Pack/i)
let qtyMatch = text.match(/₹[\d\.]+\s+(\d+)\s+₹/)

let sku = skuMatch ? skuMatch[1] : "UNKNOWN"
let pack = packMatch ? parseInt(packMatch[1]) : 1
let qty = qtyMatch ? parseInt(qtyMatch[1]) : 1

let pcs = pack * qty

let line = `SKU ${sku} (${pack}×${qty}=${pcs})`

if(storedLabelPage!=null){

const originalPdf = await PDFLib.PDFDocument.load(pdfBuffer)
const [copiedPage] = await newPdf.copyPages(originalPdf,[storedLabelPage])

newPdf.addPage(copiedPage)

let pages=newPdf.getPages()
let lastPage=pages[pages.length-1]

lastPage.drawText(line,{
x:60,
y:140,
size:12
})

storedLabelPage=null

}

}else{

storedLabelPage=i-1

}

}

const pdfBytes = await newPdf.save()

let blob=new Blob([pdfBytes],{type:"application/pdf"})

let link=document.createElement("a")

link.href=URL.createObjectURL(blob)

link.download="amazon_labels.pdf"

link.click()

}

</script>

</body>
</html>
