<!DOCTYPE html><html>
<head>
<meta charset="UTF-8">
<title>Seller Label Tool</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
body{font-family:Arial;background:#f5f6fb;text-align:center;padding:30px}
.card{background:white;padding:20px;border-radius:12px;max-width:900px;margin:auto;box-shadow:0 10px 25px rgba(0,0,0,0.1)}
select,input,button{padding:10px;margin:10px}
button{cursor:pointer}
table{border-collapse:collapse;margin:auto;margin-top:20px}
th,td{border:1px solid #ccc;padding:8px 12px}
#preview canvas{margin:10px;border:1px solid #ccc}
</style>
</head>
<body><div class="card">
<h2>Amazon / Flipkart Label Tool</h2><select id="platform">
<option value="amazon">Amazon</option>
<option value="flipkart">Flipkart</option>
</select><input type="file" id="pdfUpload" accept="application/pdf"><br><button onclick="processPDF()">Process Labels</button> <button onclick="downloadCSV()">Download SKU Summary</button>

<div id="preview"></div><h3>SKU Summary</h3><table id="summaryTable">
<tr><th>SKU</th><th>Qty</th></tr>
</table></div><script>

let skuSummary={}

async function processPDF(){

const file=document.getElementById("pdfUpload").files[0]
if(!file){alert("Upload PDF first");return}

const data=await file.arrayBuffer()
const pdf=await pdfjsLib.getDocument({data}).promise

const preview=document.getElementById("preview")
preview.innerHTML=""

skuSummary={}

for(let page=1;page<=pdf.numPages;page++){

const p=await pdf.getPage(page)

const viewport=p.getViewport({scale:1.2})

const canvas=document.createElement("canvas")
const context=canvas.getContext("2d")

canvas.height=viewport.height
canvas.width=viewport.width

await p.render({canvasContext:context,viewport}).promise

preview.appendChild(canvas)

const textContent=await p.getTextContent()

let pageText=""
textContent.items.forEach(item=>{
pageText+=item.str+" "
})

if(isInvoicePage(pageText)){
extractInvoiceData(pageText)
}

}

updateTable()

}

function isInvoicePage(text){

let t=text.toLowerCase()

return t.includes("description") && t.includes("qty")

}

function extractInvoiceData(text){

// SKU inside brackets example: Product Name (ICEBALL01)
let skuMatch=text.match(/\(([A-Za-z0-9._-]{3,})\)/)

// Qty column
let qtyMatch=text.match(/qty[: ]*(\d+)/i)

let sku = skuMatch ? skuMatch[1] : "UNKNOWN"
let qty = qtyMatch ? parseInt(qtyMatch[1]) : 1

if(skuSummary[sku]){
skuSummary[sku]+=qty
}else{
skuSummary[sku]=qty
}

}

function updateTable(){

const table=document.getElementById("summaryTable")

while(table.rows.length>1) table.deleteRow(1)

for(let sku in skuSummary){

let row=table.insertRow()
row.insertCell(0).innerText=sku
row.insertCell(1).innerText=skuSummary[sku]

}

if(Object.keys(skuSummary).length===0){

let row=table.insertRow()
row.insertCell(0).innerText="No invoice detected"
row.insertCell(1).innerText=""

}

}

function downloadCSV(){

let csv="SKU,Qty\n"

for(let sku in skuSummary){

csv+=sku+","+skuSummary[sku]+"\n"

}

const blob=new Blob([csv])

const a=document.createElement("a")

a.href=URL.createObjectURL(blob)

a.download="sku-summary.csv"

a.click()

}

</script></body>
</html>
