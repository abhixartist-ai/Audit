<!DOCTYPE html>
<html>
<head>

<title>Amazon / Flipkart Label Tool</title>
<link rel="icon" href="favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
</script>

<script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
body{
font-family:Arial;
margin:0;
padding:20px;
background:linear-gradient(135deg,#1e1e2f,#12121c);
color:#fff;
}

#dropZone{
border:2px dashed #667eea;
padding:40px;
text-align:center;
border-radius:10px;
cursor:pointer;
}

button{
margin-top:10px;
padding:12px;
border:none;
border-radius:8px;
background:#667eea;
color:#fff;
cursor:pointer;
width:100%;
}

#loader{
display:none;
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,0.7);
justify-content:center;
align-items:center;
}

#loader div{
width:50px;height:50px;
border:5px solid #333;
border-top:5px solid #667eea;
border-radius:50%;
animation:spin 1s linear infinite;
}

@keyframes spin{
100%{transform:rotate(360deg)}
}
</style>

</head>

<body>

<h2>Amazon / Flipkart Label Tool</h2>

<div id="dropZone" onclick="pdfUpload.click()">
<input type="file" id="pdfUpload" hidden>
Click or Drag PDF
</div>

<button onclick="processPDF()">Print Amazon Label</button>
<button onclick="downloadSummary()">Download Excel</button>

<div id="loader"><div></div></div>

<script>

let pdfBuffer, summary=[], skuMap={}, serial=1, orderNo=1

pdfUpload.onchange=e=>{
let file=e.target.files[0]
let r=new FileReader()
r.onload=()=>pdfBuffer=r.result
r.readAsArrayBuffer(file)
}

function show(){loader.style.display="flex"}
function hide(){loader.style.display="none"}

/* SKU MAP */
fetch("sku_map.csv").then(r=>r.text()).then(t=>{
t.split("\n").slice(1).forEach(r=>{
let c=r.split(",")
if(c.length>=2){
if(!skuMap[c[0]])skuMap[c[0]]=[]
skuMap[c[0]].push(c[1])
}
})
})

async function processPDF(){

if(!pdfBuffer){alert("Upload PDF");return}

show()

summary=[];serial=1;orderNo=1

const pdf=await pdfjsLib.getDocument({data:pdfBuffer}).promise
const newPdf=await PDFLib.PDFDocument.create()
const original=await PDFLib.PDFDocument.load(pdfBuffer)

/* LOOP PAIR (Label + Invoice) */
for(let i=1;i<=pdf.numPages;i+=2){

/* ===== LABEL PAGE ===== */
const labelPage=await pdf.getPage(i)
const content=await labelPage.getTextContent()
const items=content.items

/* SHIP DATE (POSITION BASED) */
let shipDate="NA"
let shipY=null

for(let a=0;a<items.length;a++){
if(items[a].str.toLowerCase().includes("ship date")){
shipY=items[a].transform[5]
break
}
}

if(shipY!==null){
for(let b=0;b<items.length;b++){
let y=items[b].transform[5]
let val=items[b].str

if(Math.abs(y-shipY)<5){
if(/[0-9]{1,2}\/[0-9]{1,2}\/[0-9]{2,4}/.test(val)){
shipDate=val
break
}
}
}
}

/* ===== INVOICE PAGE ===== */
const invPage=await pdf.getPage(i+1)
const invText=(await invPage.getTextContent()).items.map(x=>x.str).join(" ")

/* ORDER ID */
let orderIdMatch=invText.match(/Order\s*(ID|Number)[^\d]*([0-9-]{10,})/i)
let orderId=orderIdMatch?orderIdMatch[2]:"NA"

/* SKU */
let skuMatches=[...invText.matchAll(/\(\s*([A-Z0-9]+(?:-[A-Z0-9]+)+)\s*\)/g)]
let qtyMatches=[...invText.matchAll(/₹[\d\.]+\s+(\d+)\s+₹/g)]

/* ADD LABEL PAGE */
const [copy]=await newPdf.copyPages(original,[i-1])
newPdf.addPage(copy)

let page=newPdf.getPages().pop()

for(let k=0;k<skuMatches.length;k++){

let sku=skuMatches[k][1]
let qty=qtyMatches[k]?parseInt(qtyMatches[k][1]):1
let rep=skuMap[sku]||[sku]

let pack=0
rep.forEach(r=>{
let m=r.match(/(\d+)$/)
pack+=m?parseInt(m[1]):1
})

let pcs=pack*qty

summary.push({
order:orderNo,
orderId,
shipDate,
sno:serial++,
sku,
replacement:rep.join(", "),
qty,
pcs
})

page.drawText(rep.join(", ")+" x"+qty+" ("+pcs+")",
{x:50,y:180-(k*14),size:12})
}

orderNo++
}

/* PRINT */
let win=window.open(URL.createObjectURL(new Blob([await newPdf.save()],{type:"application/pdf"})))
setTimeout(()=>win.print(),500)
window.onfocus=hide
}

/* EXCEL */
function downloadSummary(){
let data=[["Order","Order ID","Ship Date","S.No","SKU","Replacement","Qty","PCS"]]

summary.forEach(r=>{
data.push([r.order,r.orderId,r.shipDate,r.sno,r.sku,r.replacement,r.qty,r.pcs])
})

let ws=XLSX.utils.aoa_to_sheet(data)
let wb=XLSX.utils.book_new()
XLSX.utils.book_append_sheet(wb,ws,"Summary")

XLSX.writeFile(wb,"Amazon_summary.xlsx")
}

</script>

</body>
</html>
