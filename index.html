<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Labour Attendance Manager</title>

<style>

body{
font-family:Arial;
background:linear-gradient(135deg,#667eea,#764ba2);
padding:20px;
}

.card{
background:white;
padding:20px;
border-radius:10px;
margin-bottom:20px;
box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

button{
padding:8px 14px;
background:#667eea;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
}

input,select{
padding:6px;
margin:4px;
}

table{
width:100%;
border-collapse:collapse;
}

td,th{
padding:8px;
border-bottom:1px solid #ddd;
}

.nav button{
margin-right:10px;
}

</style>
</head>

<body>

<div class="nav">
<button onclick="showPage('add')">Add Labour</button>
<button onclick="showPage('attendance')">Attendance</button>
<button onclick="showPage('report')">Salary Report</button>
</div>


<!-- ADD EMPLOYEE -->

<div id="add" class="card">

<h3>Add Labour</h3>

<input id="name" placeholder="Name">

<input id="rate" type="number" placeholder="Hourly Salary">

<input id="phone" placeholder="Phone">

<select id="type">
<option value="hourly">Hourly</option>
<option value="fixed">Fixed Salary</option>
</select>

<input id="fixedSalary" type="number" placeholder="Monthly Salary">

<br><br>

<button onclick="addLabour()">Add Labour</button>

</div>


<!-- ATTENDANCE -->

<div id="attendance" class="card" style="display:none">

<h3>Attendance</h3>

<label>Date :</label>

<input type="date" id="attDate">

<br><br>

<table id="attendanceTable"></table>

</div>



<!-- REPORT -->

<div id="report" class="card" style="display:none">

<h3>Salary Report</h3>

<button onclick="generateReport()">Generate</button>

<div id="salaryList"></div>

</div>


<script>

let labour=JSON.parse(localStorage.getItem("labour")||"[]")
let attendance=JSON.parse(localStorage.getItem("attendance")||"[]")
let advance=JSON.parse(localStorage.getItem("advance")||"[]")

function saveData(){

localStorage.setItem("labour",JSON.stringify(labour))
localStorage.setItem("attendance",JSON.stringify(attendance))
localStorage.setItem("advance",JSON.stringify(advance))

}


function showPage(p){

document.getElementById("add").style.display="none"
document.getElementById("attendance").style.display="none"
document.getElementById("report").style.display="none"

document.getElementById(p).style.display="block"

if(p=="attendance"){loadAttendance()}

}


function addLabour(){

let n=document.getElementById("name").value
let r=document.getElementById("rate").value
let ph=document.getElementById("phone").value
let t=document.getElementById("type").value
let fs=document.getElementById("fixedSalary").value

if(n==""){
alert("Enter Name")
return
}

labour.push({
name:n,
rate:parseFloat(r||0),
phone:ph,
type:t,
fixedSalary:parseFloat(fs||0)
})

saveData()

alert("Labour Added")

document.getElementById("name").value=""
document.getElementById("rate").value=""
document.getElementById("phone").value=""
document.getElementById("fixedSalary").value=""

}



function loadAttendance(){

let today=new Date().toISOString().slice(0,10)

document.getElementById("attDate").value=today

let table="<tr><th>Name</th><th>Status</th><th>Hours</th><th>Min</th><th>Advance</th></tr>"

labour.forEach((l,i)=>{

table+=`

<tr>

<td>${l.name}</td>

<td>

<select id="s${i}">
<option value="P">Present</option>
<option value="A">Absent</option>
</select>

</td>

<td>

<input type="number" id="h${i}" value="10" style="width:60px">

</td>

<td>

<input type="number" id="m${i}" value="0" style="width:60px">

</td>

<td>

<input type="number" id="adv${i}" style="width:80px">

</td>

</tr>

`

})

table+=`</table><br><button onclick="saveAttendance()">Save Attendance</button>`

document.getElementById("attendanceTable").innerHTML=table

}



function saveAttendance(){

let d=document.getElementById("attDate").value

labour.forEach((l,i)=>{

let s=document.getElementById("s"+i).value
let h=document.getElementById("h"+i).value
let m=document.getElementById("m"+i).value
let adv=document.getElementById("adv"+i).value

attendance.push({

name:l.name,
date:d,
status:s,
hours:parseFloat(h||0),
min:parseFloat(m||0)

})

if(adv>0){

advance.push({

name:l.name,
amount:parseFloat(adv)

})

}

})

saveData()

alert("Attendance Saved")

}



function generateReport(){

let html=""

labour.forEach(l=>{

let total=0

attendance.forEach(a=>{

if(a.name==l.name && a.status=="P"){

let hrs=a.hours+(a.min/60)

if(l.type=="hourly"){

total+=hrs*l.rate

}

}

})

if(l.type=="fixed"){
total=l.fixedSalary
}

let adv=0

advance.forEach(v=>{

if(v.name==l.name){
adv+=v.amount
}

})

let final=total-adv

let msg=`Salary ${l.name}
Total ₹${total}
Advance ₹${adv}
Pay ₹${final}`

let wa=`https://wa.me/${l.phone}?text=${encodeURIComponent(msg)}`

html+=`

<div class="card">

<b>${l.name}</b><br>

Total ₹${total}<br>
Advance ₹${adv}<br>
Final ₹${final}<br><br>

<a href="${wa}" target="_blank">Send WhatsApp</a>

</div>

`

})

document.getElementById("salaryList").innerHTML=html

}

</script>

</body>
</html>
