<!DOCTYPE html>
<html>
<head>

<title>Amazon PDF Tool</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
body{
font-family:Arial;
background:linear-gradient(135deg,#667eea,#764ba2);
color:white;
padding:20px;
text-align:center;
}

.card{
background:white;
color:black;
padding:20px;
border-radius:15px;
max-width:500px;
margin:auto;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

button{
padding:12px 20px;
margin-top:10px;
border:none;
border-radius:10px;
background:#667eea;
color:white;
font-weight:bold;
cursor:pointer;
}

#loader{
display:none;
margin-top:10px;
color:yellow;
}
</style>

</head>

<body>

<h2>Amazon PDF → Excel Tool</h2>

<div class="card">

<input type="file" id="pdfUpload">
<br>

<button onclick="extractExcel()">Download Excel</button>

<p id="loader">Processing... ⏳</p>

</div>

<script>

let pdfBuffer;
let skuMap = {};

// 📁 Load file
document.getElementById("pdfUpload").addEventListener("change",function(e){
let file = e.target.files[0];
if(!file) return;

let reader = new FileReader();
reader.onload = function(){
pdfBuffer = this.result;
alert("PDF Loaded ✅");
}
reader.readAsArrayBuffer(file);
});

// 📦 Load SKU CSV (same folder)
async function loadCSV(){
let res = await fetch("sku_map.csv");
let text = await res.text();

text.split("\n").forEach(line=>{
let parts = line.split(",");
if(parts.length>=2){
let sku = parts[0].trim();
let replacements = parts.slice(1).map(x=>x.trim());
skuMap[sku] = replacements;
}
});
}

// 🔥 MAIN FUNCTION
async function extractExcel(){

if(!pdfBuffer){
alert("Upload PDF first");
return;
}

document.getElementById("loader").style.display = "block";

await loadCSV();

let data = [];
let serial = 1;

const pdf = await pdfjsLib.getDocument({data:pdfBuffer}).promise;

for(let i=1;i<=pdf.numPages;i++){

const page = await pdf.getPage(i);
const text = (await page.getTextContent()).items.map(i=>i.str).join(" ");

// 👉 LABEL PAGE
if(!text.includes("Tax Invoice")){

if(i >= pdf.numPages) continue;

// 👉 NEXT PAGE = INVOICE
const invoice = await pdf.getPage(i+1);
const invText = (await invoice.getTextContent()).items.map(i=>i.str).join(" ");

if(!invText.includes("Tax Invoice")) continue;

// ✅ ORDER DETAILS
let orderNo = (invText.match(/Order Number[: ]+([\d-]+)/)||[])[1] || "";
let orderDate = (invText.match(/Order Date[: ]+([\d.]+)/)||[])[1] || "";

// ✅ SKU, QTY, AMOUNT
let sku = [...invText.matchAll(/\(\s*([A-Z0-9]+(?:-[A-Z0-9]+)+)\s*\)/g)];
let qty = [...invText.matchAll(/₹[\d\.]+\s+(\d+)\s+₹/g)];
let amt = [...invText.matchAll(/₹\s?([\d,]+\.\d+)/g)];

let orderTotal = 0;

for(let k=0;k<sku.length;k++){

let s = sku[k][1];
let q = qty[k] ? parseInt(qty[k][1]) : 1;

let amount = amt[k] ? amt[k][1] : "0";
let cleanAmt = parseFloat(amount.replace(/,/g,"")) || 0;

orderTotal += cleanAmt;

// 🔹 replacement
let rep = skuMap[s] || [s];

// 🔹 PCS calculation
let pack = 0;
rep.forEach(r=>{
let m = r.match(/(\d+)$/);
pack += m ? parseInt(m[1]) : 1;
});

let pcs = pack * q;

data.push([
serial++,
orderDate,
orderNo,
s,
rep.join(", "),
q,
pcs,
cleanAmt,
"" // gross later
]);

}

// 🔹 add gross total
data.slice(-sku.length).forEach(r=>{
r[8] = orderTotal;
});

i++; // skip invoice page
}
}

// ❌ no data
if(data.length === 0){
alert("No data found ❌");
document.getElementById("loader").style.display = "none";
return;
}

// 📊 Excel
let ws = XLSX.utils.aoa_to_sheet([
["S.No","Order Date","Order No","SKU","Replacement","Qty","Total PCS","Amount","Gross Total"],
...data
]);

let wb = XLSX.utils.book_new();
XLSX.utils.book_append_sheet(wb, ws, "Data");

XLSX.writeFile(wb,"Amazon_Data.xlsx");

document.getElementById("loader").style.display = "none";

}

</script>

</body>
</html>
